      <div class="bio-arrow" aria-hidden="true">→</div>
      <div class="bio-time"><div class="lbl">Check-out</div><div class="val">${rec && rec.checkOut ? fmt12(rec.checkOut) : "--:--"}</div></div>
    </div>
    <div class="bio-dur">
      ${dur > 0 ? fmtDur(dur) : "No duration recorded"}
      <span>Working time</span>
    </div>
    <button class="btn btn-primary btn-block" id="bioPrimary">${esc(primaryLabel)}</button>
  </div>

  <div class="card">
    <div class="card-head"><h3>Today's summary</h3><span class="pill pill-neutral">${esc(fmtShort(today))}</span></div>
    <div class="check-list">
      <button class="check-row" data-act="record">
        <span class="check-dot ${rec && rec.checkIn ? "done" : ""}">${rec && rec.checkIn ? "✓" : "1"}</span>
        <span class="lbl">Biometric record</span>
        <span class="meta">${rec && rec.checkIn ? fmt12(rec.checkIn) + (rec.checkOut ? " → " + fmt12(rec.checkOut) : "") : "Not added"}</span>
      </button>
      <button class="check-row" data-act="learning">
        <span class="check-dot ${rec && rec.learning ? "done" : ""}">${rec && rec.learning ? "✓" : "2"}</span>
        <span class="lbl">Learning entry</span>
        <span class="meta">${rec && rec.learning ? esc(rec.learning.slice(0, 40)) : "Not added"}</span>
      </button>
      <button class="check-row" data-act="referral">
        <span class="check-dot ${rec && rec.referrals && rec.referrals.length ? "done" : ""}">${rec && rec.referrals && rec.referrals.length ? "✓" : "3"}</span>
        <span class="lbl">Referrals</span>
        <span class="meta">${rec && rec.referrals && rec.referrals.length ? rec.referrals.length + " recorded" : "None"}</span>
      </button>
      <button class="check-row" data-act="remark">
        <span class="check-dot ${rec && rec.remarks ? "done" : ""}">${rec && rec.remarks ? "✓" : "4"}</span>
        <span class="lbl">Daily note</span>
        <span class="meta">${rec && rec.remarks ? esc(rec.remarks.slice(0, 40)) : "Not added"}</span>
      </button>
    </div>
  </div>

  ${healthCardHTML}

  <div class="card">
    <div class="card-head">
      <div><h3>Internship progress</h3><div class="sub">${esc(fmtShort(prog.start))} → ${esc(fmtShort(prog.end))}</div></div>
      <span class="pill pill-purple">${prog.percent.toFixed(0)}%</span>
    </div>
    <div class="progress"><i style="width:${clamp(prog.percent, 0, 100).toFixed(1)}%"></i></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);">
      <span>Day ${prog.elapsed} of ${prog.total}</span>
      <span>${prog.remaining} days remaining</span>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Leave balance</h3><span class="pill ${lv.remaining <= 0 ? "pill-absent" : "pill-neutral"}">${lv.remaining} left</span></div>
    <div class="health-info">
      <div class="row"><span>Total allowance</span><span>${lv.allowance}</span></div>
      <div class="row"><span>Used</span><span>${lv.used}</span></div>
      <div class="row"><span>Unresolved days</span><span>${lv.pending}</span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Daily boost</h3></div>
    <p class="quote">"${esc(q.t)}"</p>
    <div class="quote-author">— ${esc(q.a)}</div>
    <div class="divider"></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="pill ${state.streak.count >= 3 ? "pill-success" : "pill-neutral"}">🔥 ${state.streak.count} day streak</span>
      <span style="font-size:12px;color:var(--text-3);">Consecutive recorded days</span>
    </div>
  </div>
  `;

  $("#bioPrimary").addEventListener("click", () => {
    if (primaryAct === "add" || primaryAct === "edit") openRecordSheet(today);
    else openCheckoutSheet();
  });

  $$("#view-home [data-act]").forEach(b => {
    b.addEventListener("click", () => {
      const a = b.dataset.act;
      if (a === "record") openRecordSheet(today);
      else if (a === "learning") openLearningSheet();
      else if (a === "referral") openReferralSheet();
      else if (a === "remark") openRemarkSheet();
      else if (a === "insights") go("insights");
      else if (a === "settings") go("settings");
    });
  });
}

function healthStatus(percent) {
  const req = Number(state.config.requiredPercent) || 0;
  const buffer = percent - req;
  if (buffer >= 2) return { label: "SAFE", cls: "pill-success", color: cssVar("--success") };
  if (buffer >= 0) return { label: "CAUTION", cls: "pill-half", color: cssVar("--half") };
  return { label: "AT RISK", cls: "pill-absent", color: cssVar("--absent") };
}

/* =========================================================================
   VIEW: CALENDAR
   ========================================================================= */
function renderCalendar() {
  const el = $("#view-calendar");
  if (!state.calMonth) { const n = nowDate(); state.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
  const m = state.calMonth;
  const year = m.getFullYear(), month = m.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = todayISO();

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push('<div class="cal-day empty"></div>');
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = year + "-" + pad2(month + 1) + "-" + pad2(d);
    const rec = getRecord(iso);
    const st = statusFor(iso, rec);
    let cls = "cal-day", dot = "";
    if (st === "Full Day") { cls += " s-full"; dot = '<span class="dot"></span>'; }
    else if (st === "Half Day") { cls += " s-half"; dot = '<span class="dot"></span>'; }
    else if (st === "Leave") { cls += " s-leave"; dot = '<span class="dot"></span>'; }
    else if (st === "Absent") { cls += " s-absent"; dot = '<span class="dot"></span>'; }
    else if (st === "Pending") { cls += " s-pending"; dot = '<span class="dot"></span>'; }
    else if (st === "Holiday") { cls += " s-holiday"; dot = '<span class="dot"></span>'; }
    else if (st === "Off Day") cls += " s-off";
    if (iso === today) cls += " today";
    cells.push('<button class="' + cls + '" data-date="' + iso + '" aria-label="' + esc(fmtLong(iso) + " — " + st) + '">' + d + dot + "</button>");
  }

  const monthStart = year + "-" + pad2(month + 1) + "-01";
  const monthEnd = year + "-" + pad2(month + 1) + "-" + pad2(daysInMonth);
  const isFutureMonth = monthStart > today;
  const ms = monthlyStats(monthStart, monthEnd);

  let summaryHTML = '<p class="hint">No data for this month.</p>';
  if (ms.length) summaryHTML = monthSummaryHTML(ms[0]);

  el.innerHTML = `
  <div class="view-head"><div><h1>Calendar</h1><div class="sub">Tap a day to see or add its record</div></div></div>
  <div class="card">
    <div class="cal-head">
      <button class="icon-btn" id="calPrev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="m15 6-6 6 6 6"/></svg></button>
      <div class="cal-title">${MONTHS[month]} ${year}</div>
      <button class="icon-btn" id="calNext" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <div class="cal-grid">
      ${DOW_SHORT.map(d => '<div class="cal-dow">' + d + "</div>").join("")}
      ${cells.join("")}
    </div>
    <div class="legend">
      <span><i style="background:var(--success)"></i>Full day</span>
      <span><i style="background:var(--half)"></i>Half day</span>
      <span><i style="background:var(--leave)"></i>Leave</span>
      <span><i style="background:var(--absent)"></i>Absent</span>
      <span><i style="background:var(--pending)"></i>Pending</span>
      <span><i style="background:var(--holiday)"></i>Holiday</span>
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Month summary</h3>${isFutureMonth ? '<span class="pill pill-neutral">Future</span>' : ""}</div>
    ${summaryHTML}
  </div>
  `;

  $("#calPrev").addEventListener("click", () => { state.calMonth = new Date(year, month - 1, 1); renderCalendar(); });
  $("#calNext").addEventListener("click", () => { state.calMonth = new Date(year, month + 1, 1); renderCalendar(); });
  $$("#view-calendar .cal-day[data-date]").forEach(b => b.addEventListener("click", () => openDaySheet(b.dataset.date)));
}

function monthSummaryHTML(m) {
  if (!m) return '<p class="hint">No data for this month.</p>';
  return '<div class="health-info">' +
    '<div class="row"><span>Working days</span><span>' + m.working + "</span></div>" +
    '<div class="row"><span>Full days</span><span>' + m.full + "</span></div>" +
    '<div class="row"><span>Half days</span><span>' + m.half + "</span></div>" +
    '<div class="row"><span>Leave / Absent</span><span>' + m.leave + " / " + m.absent + "</span></div>" +
    '<div class="row"><span>Pending</span><span>' + m.pending + "</span></div>" +
    '<div class="row"><span>Attendance</span><span>' + m.percent.toFixed(1) + "%</span></div>" +
    '<div class="row"><span>Total working hours</span><span>' + fmtDur(m.minutes) + "</span></div>" +
    "</div>";
}

/* =========================================================================
   VIEW: INSIGHTS
   ========================================================================= */
function insightRange() {
  const today = todayISO();
  const r = state.insRange;
  if (r === "all") { const ir = internshipRange(); return { from: ir.start, to: today }; }
  if (r === "month") { const d = nowDate(); return { from: toISO(new Date(d.getFullYear(), d.getMonth(), 1)), to: today }; }
  const days = Number(r) || 30;
  return { from: toISO(addDays(nowDate(), -(days - 1))), to: today };
}

function renderInsights() {
  const el = $("#view-insights");
  const { from, to } = insightRange();
  const stats = computeStats(from, to);
  const months = monthlyStats(from, to);
  const health = healthStatus(stats.percent);
  const prog = internshipProgress();
  const lv = leaveSummary();
  const ir = internshipRange();
  const allStats = computeStats(ir.start, todayISO());

  let trendPoints = [], trendTitle = "Attendance trend";
  if (months.length > 1) {
    trendPoints = months.map(m => ({
      label: monthLabel(m.key), value: +m.percent.toFixed(1),
      title: monthLabel(m.key),
      lines: [["Attendance", m.percent.toFixed(1) + "%"], ["Full days", m.full], ["Half days", m.half], ["Leave", m.leave], ["Absent", m.absent], ["Pending", m.pending]]
    }));
  } else {
    let credit = 0, work = 0;
    for (const d of eachDay(from, to)) {
      if (!isWorkingDay(d) || isHoliday(d)) continue;
      const rec = getRecord(d); const st = statusFor(d, rec);
      work++;
      if (st === "Full Day") credit += 1;
      else if (st === "Half Day" || st === "Checked In") credit += 0.5;
      const pct = work ? (credit / work) * 100 : 0;
      trendPoints.push({
        label: fmtShort(d), value: +pct.toFixed(1), title: fmtShort(d),
        lines: [["Attendance", pct.toFixed(1) + "%"], ["Working days", work], ["Present", credit]]
      });
    }
    trendTitle = "Cumulative attendance";
  }

  let trendSummary = "";
  if (trendPoints.length >= 2) {
    const delta = trendPoints[trendPoints.length - 1].value - trendPoints[0].value;
    if (Math.abs(delta) < 0.05) trendSummary = "Your attendance is holding steady over this period.";
    else if (delta > 0) trendSummary = "Your attendance improved by " + delta.toFixed(1) + " percentage points over this period.";
    else trendSummary = "Your attendance dropped by " + Math.abs(delta).toFixed(1) + " percentage points over this period.";
  }

  const workPoints = [];
  for (const d of eachDay(from, to)) {
    if (!isWorkingDay(d) || isHoliday(d)) continue;
    const rec = getRecord(d);
    const m = workMinutes(rec);
    if (!m) continue;
    workPoints.push({
      label: fmtShort(d), value: +(m / 60).toFixed(2), title: fmtShort(d),
      lines: [["In", fmt12(rec.checkIn)], ["Out", fmt12(rec.checkOut)], ["Duration", fmtDur(m)]]
    });
  }

  const inPoints = [], outPoints = [];
  for (const r of myRecords().slice().sort((a, b) => a.date.localeCompare(b.date))) {
    if (r.date < from || r.date > to) continue;
    if (r.checkIn) {
      const m = toMin(r.checkIn);
      inPoints.push({ label: fmtShort(r.date), value: m, title: fmtShort(r.date), lines: [["Check-in", fmt12(r.checkIn)]] });
    }
    if (r.checkOut) {
      const m = toMin(r.checkOut);
      outPoints.push({ label: fmtShort(r.date), value: m, title: fmtShort(r.date), lines: [["Check-out", fmt12(r.checkOut)], ["Duration", fmtDur(workMinutes(r))]] });
    }
  }
  const avgIn = inPoints.length ? Math.round(inPoints.reduce((s, p) => s + p.value, 0) / inPoints.length) : null;
  const avgOut = outPoints.length ? Math.round(outPoints.reduce((s, p) => s + p.value, 0) / outPoints.length) : null;
  const timeFmt = v => { let h = Math.floor(v / 60), m = Math.round(v % 60); const ap = h >= 12 ? "p" : "a"; h = h % 12 || 12; return h + (m ? ":" + pad2(m) : "") + ap; };

  const bd = [
    { label: "Full Day", value: stats.full, color: "var(--success)" },
    { label: "Half Day", value: stats.half, color: "var(--half)" },
    { label: "Leave", value: stats.leave, color: "var(--leave)" },
    { label: "Absent", value: stats.absent, color: "var(--absent)" },
    { label: "Pending", value: stats.pending, color: "var(--pending)" }
  ];
  const bdMax = Math.max(1, ...bd.map(x => x.value));

  const remainingWorkingDays = countWorkingDays(toISO(addDays(nowDate(), 1)), ir.end);
  const totalWorkingDays = allStats.working + remainingWorkingDays;
  const projected = totalWorkingDays > 0 ? (allStats.credit / totalWorkingDays) * 100 : 0;
  const projStatus = projected >= state.config.requiredPercent + 2 ? { l: "ON TRACK", c: "pill-success" }
    : projected >= state.config.requiredPercent ? { l: "CAUTION", c: "pill-half" } : { l: "AT RISK", c: "pill-absent" };
  const maxMissable = Math.max(0, Math.floor(allStats.credit + remainingWorkingDays - (state.config.requiredPercent / 100) * totalWorkingDays));

  el.innerHTML = `
  <div class="view-head"><div><h1>Insights</h1><div class="sub">${esc(fmtShort(from))} → ${esc(fmtShort(to))}</div></div></div>

  <div class="chips" id="insChips">
    ${[["7", "7 days"], ["30", "30 days"], ["month", "This month"], ["90", "3 months"], ["all", "Internship"]]
      .map(([v, l]) => '<button class="chip' + (state.insRange === v ? " active" : "") + '" data-range="' + v + '">' + l + "</button>").join("")}
  </div>

  <div class="card">
    <div class="card-head">
      <div><h3>Attendance health</h3><div class="sub">Selected period</div></div>
      <span class="pill ${health.cls}">${health.label}</span>
    </div>
    <div class="health">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="bg" cx="60" cy="60" r="52"></circle>
          <circle cx="60" cy="60" r="52" stroke="${health.color}" stroke-dasharray="${(clamp(stats.percent,0,100)*3.267).toFixed(1)} 326.7"></circle>
        </svg>
        <div class="ring-center"><b>${stats.percent.toFixed(1)}%</b><small>ATTENDANCE</small></div>
      </div>
      <div class="health-info">
        <div class="row"><span>Required</span><span>${state.config.requiredPercent}%</span></div>
        <div class="row"><span>Buffer</span><span style="color:${health.color}">${(stats.percent - state.config.requiredPercent >= 0 ? "+" : "") + (stats.percent - state.config.requiredPercent).toFixed(1)}%</span></div>
        <div class="row"><span>Working days</span><span>${stats.working}</span></div>
        <div class="row"><span>Recorded</span><span>${stats.recorded}</span></div>
        <div class="row"><span>Pending</span><span>${stats.pending}</span></div>
        <div class="row"><span>Working hours</span><span>${fmtDur(stats.minutes)}</span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div><h3>Projection</h3><div class="sub">Based on current records and remaining days</div></div>
      <span class="pill ${projStatus.c}">${projStatus.l}</span>
    </div>
    <div class="health-info">
      <div class="row"><span>Current attendance</span><span>${allStats.percent.toFixed(1)}%</span></div>
      <div class="row"><span>Projected final</span><span>${projected.toFixed(1)}%</span></div>
      <div class="row"><span>Required</span><span>${state.config.requiredPercent}%</span></div>
      <div class="row"><span>Working days left</span><span>${remainingWorkingDays}</span></div>
    </div>
    <p class="hint">This is a projection, not a guarantee. It assumes your future attendance follows your current pattern.</p>
  </div>

  <div class="card">
    <div class="card-head"><h3>${trendTitle}</h3></div>
    ${trendSummary ? '<p class="chart-summary">' + esc(trendSummary) + "</p>" : ""}
    ${trendPoints.length >= 2
      ? '<div class="chart-box" style="height:210px"><canvas id="cTrend" role="img" aria-label="Line chart of attendance percentage over time"></canvas><div class="chart-tip" style="opacity:0"></div></div>'
      : '<div class="empty-state"><b>No attendance trend yet</b>Add a few biometric records to see your trend.<div style="margin-top:12px"><button class="btn btn-primary btn-sm" id="emptyAdd">+ Add record</button></div></div>'}
    ${trendPoints.length >= 2 ? '<p class="hint">The dashed line marks your required attendance of ' + state.config.requiredPercent + "%.</p>" : ""}
  </div>

  <div class="card">
    <div class="card-head"><h3>Working time</h3><div class="sub">Hours recorded per day</div></div>
    ${workPoints.length >= 2
      ? '<div class="chart-box" style="height:200px"><canvas id="cWork" role="img" aria-label="Line chart of daily working hours"></canvas><div class="chart-tip" style="opacity:0"></div></div><p class="hint">' + "Average " + (workPoints.reduce((s,p)=>s+p.value,0)/workPoints.length).toFixed(1) + " hours across " + workPoints.length + " recorded days.</p>"
      : '<div class="empty-state"><b>Not enough data</b>Record a few check-in/check-out pairs to see working time.</div>'}
  </div>

  <div class="card">
    <div class="card-head"><h3>Monthly attendance</h3><div class="sub">Month by month comparison</div></div>
    ${months.length >= 1
      ? '<div class="chart-box" style="height:200px"><canvas id="cMonthly" role="img" aria-label="Bar chart of monthly attendance percentage"></canvas><div class="chart-tip" style="opacity:0"></div></div>'
      : '<div class="empty-state"><b>No monthly data</b>Add records to compare months.</div>'}
  </div>

  <div class="card">
    <div class="card-head"><h3>Status breakdown</h3><div class="sub">Selected period</div></div>
    <div class="breakdown">
      ${bd.map(x => `
        <div class="bd-row">
          <span>${esc(x.label)}</span>
          <div class="bd-track"><div class="bd-fill" style="width:${(x.value / bdMax * 100).toFixed(1)}%;background:${x.color}"></div></div>
          <span class="bd-val">${x.value}</span>
        </div>`).join("")}
    </div>
    <p class="hint" aria-live="polite">${stats.full} full days, ${stats.half} half days, ${stats.leave} leave days, ${stats.absent} absences and ${stats.pending} unresolved days in this period.</p>
  </div>

  <div class="card">
    <div class="card-head"><h3>Check-in pattern</h3>${avgIn != null ? '<span class="pill pill-neutral">Avg ' + timeFmt(avgIn) + "</span>" : ""}</div>
    ${inPoints.length >= 2
      ? '<div class="chart-box" style="height:200px"><canvas id="cIn" role="img" aria-label="Line chart of check-in times"></canvas><div class="chart-tip" style="opacity:0"></div></div>'
      : '<div class="empty-state"><b>Not enough check-ins</b>Add check-in times to see your pattern.</div>'}
  </div>

  <div class="card">
    <div class="card-head"><h3>Check-out pattern</h3>${avgOut != null ? '<span class="pill pill-neutral">Avg ' + timeFmt(avgOut) + "</span>" : ""}</div>
    ${outPoints.length >= 2
      ? '<div class="chart-box" style="height:200px"><canvas id="cOut" role="img" aria-label="Line chart of check-out times"></canvas><div class="chart-tip" style="opacity:0"></div></div>'
      : '<div class="empty-state"><b>Not enough check-outs</b>Add check-out times to see your pattern.</div>'}
  </div>

  <div class="card">
    <div class="card-head"><h3>Working hours by month</h3></div>
    ${months.length >= 1
      ? '<div class="chart-box" style="height:200px"><canvas id="cHours" role="img" aria-label="Bar chart of total working hours per month"></canvas><div class="chart-tip" style="opacity:0"></div></div>'
      : '<div class="empty-state"><b>No hours recorded</b>Add biometric records first.</div>'}
  </div>

  <div class="card">
    <div class="card-head"><h3>Internship progress</h3><span class="pill pill-purple">${prog.percent.toFixed(0)}% complete</span></div>
    <div class="progress"><i style="width:${clamp(prog.percent, 0, 100).toFixed(1)}%"></i></div>
    <div class="health-info">
      <div class="row"><span>Days completed</span><span>${prog.elapsed}</span></div>
      <div class="row"><span>Days remaining</span><span>${prog.remaining}</span></div>
      <div class="row"><span>Learning entries</span><span>${myRecords().filter(r => r.learning).length}</span></div>
      <div class="row"><span>Leaves remaining</span><span>${lv.remaining}</span></div>
      <div class="row"><span>Days you can still miss</span><span>${maxMissable}</span></div>
    </div>
  </div>
  `;

  const req = state.config.requiredPercent;
  if (trendPoints.length >= 2) {
    chartLine($("#cTrend"), {
      points: trendPoints, height: 210, min: 0, max: 100,
      formatY: v => v + "%", threshold: req, thresholdLabel: "Required " + req + "%",
      color: cssVar("--primary")
    });
  }
  if (workPoints.length >= 2) {
    chartLine($("#cWork"), { points: workPoints, height: 200, minZero: true, formatY: v => v.toFixed(1) + "h", color: cssVar("--success") });
  }
  if (months.length >= 1) {
    chartBar($("#cMonthly"), {
      points: months.map(m => ({
        label: monthLabel(m.key), value: +m.percent.toFixed(1), title: monthLabel(m.key),
        lines: [["Attendance", m.percent.toFixed(1) + "%"], ["Full days", m.full], ["Half days", m.half], ["Pending", m.pending]]
      })),
      height: 200, formatY: v => v + "%", color: cssVar("--primary")
    });
    chartBar($("#cHours"), {
      points: months.map(m => ({
        label: monthLabel(m.key), value: +(m.minutes / 60).toFixed(1), title: monthLabel(m.key),
        lines: [["Hours", (m.minutes / 60).toFixed(1) + "h"], ["Days recorded", m.full + m.half]]
      })),
      height: 200, formatY: v => v + "h", color: cssVar("--purple")
    });
  }
  if (inPoints.length >= 2) {
    const lo = Math.min(...inPoints.map(p => p.value)), hi = Math.max(...inPoints.map(p => p.value));
    chartLine($("#cIn"), { points: inPoints, height: 200, min: lo - 20, max: hi + 20, formatY: timeFmt, color: cssVar("--leave") });
  }
  if (outPoints.length >= 2) {
    const lo = Math.min(...outPoints.map(p => p.value)), hi = Math.max(...outPoints.map(p => p.value));
    chartLine($("#cOut"), { points: outPoints, height: 200, min: lo - 20, max: hi + 20, formatY: timeFmt, color: cssVar("--pending") });
  }

  $$("#insChips .chip").forEach(c => c.addEventListener("click", () => { state.insRange = c.dataset.range; renderInsights(); }));
  const ea = $("#emptyAdd"); if (ea) ea.addEventListener("click", () => openRecordSheet(todayISO()));
}

/* =========================================================================
   VIEW: RECORDS
   ========================================================================= */
let recSearchTimer = null;
function renderRecords() {
  const el = $("#view-records");
  const tabs = [["biometric", "Biometric"], ["learning", "Learning"], ["referrals", "Referrals"], ["notes", "Notes"]];
  const recs = myRecords().slice().sort((a, b) => b.date.localeCompare(a.date));

  let body = "";
  if (state.recTab === "biometric") {
    const q = state.search.toLowerCase();
    const filtered = recs.filter(r => {
      const st = statusFor(r.date, r);
      if (state.statusFilter !== "all" && st !== state.statusFilter) return false;
      if (q && !(r.date + " " + (r.remarks || "") + " " + (r.learning || "")).toLowerCase().includes(q)) return false;
      return true;
    });
    body = filtered.length ? filtered.map(r => {
      const st = statusFor(r.date, r);
      const dur = workMinutes(r);
      const d = fromISO(r.date);
      return `<button class="record" data-date="${r.date}">
        <span class="rec-date"><b>${d.getDate()}</b><span>${MON_SHORT[d.getMonth()]}</span></span>
        <span class="rec-main">
          <span class="rec-times">${r.checkIn ? fmt12(r.checkIn) : "—"} → ${r.checkOut ? fmt12(r.checkOut) : "—"}</span>
          <span class="rec-meta">${dur ? fmtDur(dur) + " · " : ""}${esc(r.remarks || r.learning || "No notes")}</span>
        </span>
        <span class="pill ${statusPillClass(st)}">${esc(st)}</span>
      </button>`;
    }).join("") : '<div class="empty-state"><b>No records found</b>Try changing the filter, or add your first biometric record.<div style="margin-top:12px"><button class="btn btn-primary btn-sm" id="recAdd">+ Add record</button></div></div>';
  } else if (state.recTab === "learning") {
    const items = recs.filter(r => r.learning);
    body = items.length ? items.map(r => `<div class="record"><span class="rec-date"><b>${fromISO(r.date).getDate()}</b><span>${MON_SHORT[fromISO(r.date).getMonth()]}</span></span><span class="rec-main"><span class="rec-times" style="font-weight:500">${esc(r.learning)}</span><span class="rec-meta">${r.rating ? "★".repeat(r.rating) : ""}</span></span></div>`).join("")
      : '<div class="empty-state"><b>No learning entries</b>Note what you learned each day.<div style="margin-top:12px"><button class="btn btn-primary btn-sm" id="recLearn">+ Add learning</button></div></div>';
  } else if (state.recTab === "referrals") {
    const all = [];
    recs.forEach(r => (r.referrals || []).forEach(ref => all.push({ date: r.date, ref })));
    body = all.length ? all.map(x => `<div class="ref-item"><span class="pill pill-neutral">${esc(fmtShort(x.date))}</span><span style="flex:1"><b>${esc(x.ref.ipd || "")}</b> ${esc(x.ref.patient || "")}<div style="font-size:11.5px;color:var(--text-3)">${esc(x.ref.dept || "—")}</div></span><span class="pill ${x.ref.done ? "pill-success" : "pill-pending"}">${esc(x.ref.status || "Pending")}</span></div>`).join("")
      : '<div class="empty-state"><b>No referrals recorded</b>Log referrals to keep a personal record.<div style="margin-top:12px"><button class="btn btn-primary btn-sm" id="recRef">+ Add referral</button></div></div>';
  } else {
    const items = recs.filter(r => r.remarks);
    body = items.length ? items.map(r => `<div class="record"><span class="rec-date"><b>${fromISO(r.date).getDate()}</b><span>${MON_SHORT[fromISO(r.date).getMonth()]}</span></span><span class="rec-main"><span class="rec-times" style="font-weight:500">${esc(r.remarks)}</span></span></div>`).join("")
      : '<div class="empty-state"><b>No notes yet</b>Add a short note to any day.<div style="margin-top:12px"><button class="btn btn-primary btn-sm" id="recNote">+ Add note</button></div></div>';
  }

  el.innerHTML = `
  <div class="view-head"><div><h1>Records</h1><div class="sub">${myRecords().length} total entries</div></div></div>
  <div class="seg" role="tablist">
    ${tabs.map(([k, l]) => '<button role="tab" aria-selected="' + (state.recTab === k) + '" class="' + (state.recTab === k ? "active" : "") + '" data-tab="' + k + '">' + l + "</button>").join("")}
  </div>
  ${state.recTab === "biometric" ? `
  <div class="card" style="padding:13px">
    <input type="text" id="recSearch" placeholder="Search records…" value="${esc(state.search)}"
      style="width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);font-size:14px;margin-bottom:9px">
    <div class="chips" style="padding-bottom:0">
      ${["all", "Full Day", "Half Day", "Leave", "Absent", "Pending"].map(s =>
        '<button class="chip' + (state.statusFilter === s ? " active" : "") + '" data-filter="' + s + '">' + (s === "all" ? "All" : s) + "</button>").join("")}
    </div>
  </div>` : ""}
  <div class="card">${body}</div>
  <div class="card">
    <div class="card-head"><h3>Reports & backup</h3></div>
    <div class="grid-2">
      <button class="btn btn-sm" id="btnCsv">Export CSV</button>
      <button class="btn btn-sm" id="btnBackup">Export backup</button>
      <button class="btn btn-sm" id="btnCert">Certificate</button>
      <button class="btn btn-sm" id="btnRestore">Restore backup</button>
    </div>
  </div>
  `;

  $$("#view-records .seg button").forEach(b => b.addEventListener("click", () => { state.recTab = b.dataset.tab; renderRecords(); }));
  $$("#view-records [data-date]").forEach(b => b.addEventListener("click", () => openDaySheet(b.dataset.date)));
  $$("#view-records [data-filter]").forEach(b => b.addEventListener("click", () => { state.statusFilter = b.dataset.filter; renderRecords(); }));

  const srch = $("#recSearch");
  if (srch) {
    srch.addEventListener("input", e => {
      state.search = e.target.value;
      clearTimeout(recSearchTimer);
      recSearchTimer = setTimeout(() => {
        const pos = state.search.length;
        renderRecords();
        const n = $("#recSearch");
        if (n) { n.focus(); n.setSelectionRange(pos, pos); }
      }, 180);
    });
  }
  const rA = $("#recAdd"); if (rA) rA.addEventListener("click", () => openRecordSheet(todayISO()));
  const rL = $("#recLearn"); if (rL) rL.addEventListener("click", openLearningSheet);
  const rR = $("#recRef"); if (rR) rR.addEventListener("click", openReferralSheet);
  const rN = $("#recNote"); if (rN) rN.addEventListener("click", openRemarkSheet);
  $("#btnCsv").addEventListener("click", exportCSV);
  $("#btnBackup").addEventListener("click", exportBackup);
  $("#btnCert").addEventListener("click", openCertificate);
  $("#btnRestore").addEventListener("click", () => { const f = $("#restoreInput"); if (f) f.click(); });
}

  $$("#themeSeg button").forEach(b => b.addEventListener("click", () => {

  }));
  $$("#view-settings [data-delhol]").forEach(b => b.addEventListener("click", () => { delete state.holidays[b.dataset.delhol]; saveHolidays(); renderSettings(); toast("Holiday removed"); }));
  $("#addHol").addEventListener("click", () => {

  const nTog = $("#notifyToggle");
  if (nTog) nTog.addEventListener("change", e => {
    if (e.target.checked) {
      Notification.requestPermission().then(perm => {
        if (perm === "granted") {
          state.config.notifyEnabled = true; saveConfig(); scheduleReminders(); toast("Reminders enabled");

          state.config.notifyEnabled = false; saveConfig(); toast("Notifications blocked", true);
        }

      });
    } else {
      state.config.notifyEnabled = false; saveConfig(); toast("Reminders disabled"); renderSettings();

  $("#setBackup").addEventListener("click", exportBackup);
  $("#setRestore").addEventListener("click", () => $("#restoreInput").click());

  $("#setCsvImport").addEventListener("click", () => $("#csvInput").click());

  $("#csvInput").addEventListener("change", e => { if (e.target.files[0]) importCSV(e.target.files[0]); e.target.value = ""; });
  $("#clearAll").addEventListener("click", () => {

      actions: [
        { label: "Cancel", onClick: closeSheet },

          Object.values(KEYS).forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
          closeSheet();
          setTimeout(() => location.reload(), 300);
        } }
      ]
    });
  });
}

/* =========================================================================
   SHEETS: record / learning / referral / remark / day detail
   ========================================================================= */
function openRecordSheet(iso) {
  const existing = getRecord(iso);
  const isNew = !existing;
  let pendingPhoto = existing ? existing.photo : null;

  openSheet({
    title: isNew ? "Add biometric record" : "Edit record",
    body: `
      <div class="field"><label for="fDate">Date</label><input type="date" id="fDate" value="${esc(iso)}" ${isNew ? "" : "disabled"} max="${todayISO()}"></div>
      <div class="grid-2">
        <div class="field"><label for="fIn">Check-in</label><input type="time" id="fIn" value="${esc(existing ? existing.checkIn : "")}"></div>
        <div class="field"><label for="fOut">Check-out</label><input type="time" id="fOut" value="${esc(existing ? existing.checkOut : "")}"></div>
      </div>
      <div class="field"><label for="fNote">Note (optional)</label><input type="text" id="fNote" value="${esc(existing ? existing.remarks : "")}" placeholder="Any detail about this day"></div>
      <div class="field"><label for="fPhoto">Biometric slip / photo (optional)</label><input type="file" id="fPhoto" accept="image/*"></div>
      <div id="fPreview">${existing && existing.photo ? '<img src="' + existing.photo + '" alt="Attached slip" style="max-width:110px;border-radius:12px;border:1px solid var(--border)">' : ""}</div>
      <div class="hint" id="fHint">Full day requires check-in between ${fmt12(state.config.inStart)}–${fmt12(state.config.inEnd)} and check-out between ${fmt12(state.config.outStart)}–${fmt12(state.config.outEnd)}.${existing && (existing.isLeave || existing.isAbsent) ? " Saving with times will clear the leave/absent mark." : ""}</div>
    `,
    actions: [
      ...(isNew ? [] : [{ label: "Delete", class: "btn-danger", onClick: () => confirmDelete(iso) }]),
      { label: isNew ? "Save record" : "Save changes", class: "btn-primary", onClick: () => saveRecord(iso, isNew, () => pendingPhoto) }
    ]
  });

  $("#fPhoto").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      pendingPhoto = ev.target.result;
      $("#fPreview").innerHTML = '<img src="' + pendingPhoto + '" alt="Attached slip" style="max-width:110px;border-radius:12px;border:1px solid var(--border)">';
    };
    r.readAsDataURL(f);
  });
}

function saveRecord(iso, isNew, getPhoto) {
  const d = $("#fDate").value || iso;
  const inT = $("#fIn").value;
  const outT = $("#fOut").value;
  const note = $("#fNote").value.trim();
  const photo = getPhoto ? getPhoto() : null;

  const hint = $("#fHint");
  const fail = msg => { hint.className = "hint error"; hint.textContent = msg; };

  if (d > todayISO()) return fail("You cannot record attendance for a future date.");
  if (!inT && !outT) return fail("Enter at least a check-in or a check-out time.");
  if (inT && outT && toMin(outT) <= toMin(inT)) return fail("Check-out cannot be earlier than or equal to check-in.");
  if (isNew && getRecord(d)) return fail("This date already has an attendance record.");

  const name = state.profile.name || "";
  if (isNew) {
    state.records.push({
      id: uid(), date: d, name, checkIn: inT, checkOut: outT,
      isLeave: false, isAbsent: false, leaveReason: "",
      learning: "", remarks: note, referrals: [], rating: 0,
      photo: photo || null, audit: [], createdAt: new Date().toISOString(), updatedAt: null
    });
  } else {
    const rec = getRecord(d);
    if (!rec) return fail("Record not found.");
    const changes = [];
    if (rec.checkIn !== inT) changes.push({ field: "Check-in", from: rec.checkIn || "—", to: inT || "—" });
    if (rec.checkOut !== outT) changes.push({ field: "Check-out", from: rec.checkOut || "—", to: outT || "—" });
    if ((rec.remarks || "") !== note) changes.push({ field: "Note", from: rec.remarks || "—", to: note || "—" });
    if (changes.length) {
      if (!rec.audit) rec.audit = [];
      rec.audit.push({ at: new Date().toISOString(), changes, reason: "Manual correction" });
    }
    rec.checkIn = inT; rec.checkOut = outT; rec.remarks = note;
    if (inT || outT) { rec.isLeave = false; rec.isAbsent = false; rec.leaveReason = ""; }
    if (photo) rec.photo = photo;
    rec.updatedAt = new Date().toISOString();
  }

  const saved = getRecord(d);
  const st = statusFor(d, saved);
  if (saved.checkIn) updateStreak(d);
  saveRecords();
  closeSheet();
  refresh();
  toast("Saved · " + st);
}

function download(filename, text, type) {
  const blob = new Blob([text], { type: type || "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

function csvCell(s) { return '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"'; }

    rows.push([

      leaveCost(r.date, r), r.learning || "", refs, r.rating || 0, r.remarks || ""

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try { data = JSON.parse(e.target.result); } catch (err) { return toast("That file is not a valid InternDoc backup.", true); }
    if (!data || !Array.isArray(data.records)) return toast("That file is not a valid InternDoc backup.", true);
    const invalid = data.records.filter(r => !r || !/^\d{4}-\d{2}-\d{2}$/.test(r.date || ""));
    openSheet({
      title: "Restore backup?",
      body: '<p class="hint">This backup contains <b>' + data.records.length + "</b> records" +
        (invalid.length ? ' and <b style="color:var(--absent)">' + invalid.length + " invalid entries</b> which will be skipped" : "") +
        ".<br><br>Restoring will <b>replace</b> the data currently on this device. Your existing records are safe until you confirm.</p>",
      actions: [
        { label: "Cancel", onClick: closeSheet },
        { label: "Replace data", class: "btn-danger", onClick: () => {
          state.records = data.records.filter(r => r && /^\d{4}-\d{2}-\d{2}$/.test(r.date)).map(normaliseRecord);
          if (data.profile) state.profile = Object.assign({ name: "", organization: "", department: "" }, data.profile);
          if (data.config) {
            state.config = Object.assign({}, DEFAULT_CONFIG, data.config);
            if (!Array.isArray(state.config.workDays)) state.config.workDays = DEFAULT_CONFIG.workDays.slice();
          }
          if (data.holidays) state.holidays = data.holidays;
          if (data.streak) state.streak = data.streak;
          saveRecords(); saveProfile(); saveConfig(); saveHolidays(); saveStreak();
          closeSheet(); applyTheme(); refresh();
          toast("Backup restored · " + state.records.length + " records");
        } }
      ]
    });
  };
  reader.readAsText(file);
}

function importCSV(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const text = String(e.target.result).replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
    const lines = text.split("\n").filter(l => l.trim());
    if (lines.length < 2) return toast("That CSV appears to be empty.", true);
    const added = []; let skipped = 0;
    const name = state.profile.name || "";
    const existing = new Set(state.records.filter(r => (r.name || "") === name).map(r => r.date));
    for (let i = 1; i < lines.length; i++) {
      const parts = splitCSVLine(lines[i]);
      const date = (parts[0] || "").trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { skipped++; continue; }
      if (existing.has(date)) { skipped++; continue; }
      existing.add(date);
      added.push(normaliseRecord({
        id: uid(), date, name,
        checkIn: (parts[2] || "").trim(), checkOut: (parts[3] || "").trim(),
        learning: parts[6] || "", remarks: parts[9] || "",
        rating: parseInt(parts[8], 10) || 0
      }));
    }
    if (!added.length) return toast("No valid new records found (" + skipped + " skipped).", true);
    state.records.push(...added);
    saveRecords(); closeSheet(); refresh();
    toast("Imported " + added.length + " records" + (skipped ? " · " + skipped + " skipped" : ""));
  };
  reader.readAsText(file);
}
function splitCSVLine(line) {
  const out = []; let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ",") { out.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

/* =========================================================================

   ========================================================================= */
function updateStreak(iso) {
  const last = state.streak.last;
  if (!last) state.streak.count = 1;
  else {
    const d = diffDays(last, iso);
    if (d === 0) return;
    if (d === 1) state.streak.count += 1;
    else state.streak.count = 1;
  }
  state.streak.last = iso;
  saveStreak();
}

/* =========================================================================

   ========================================================================= */
const mq = window.matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const t = state.config.theme || "system";
  const resolved = t === "system" ? (mq.matches ? "dark" : "light") : t;
  document.documentElement.setAttribute("data-theme", resolved);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    const colors = { light: "#2563eb", dark: "#0a1120", amoled: "#000000" };
    meta.setAttribute("content", colors[resolved] || "#2563eb");
  }
}
if (mq.addEventListener) mq.addEventListener("change", () => { if ((state.config.theme || "system") === "system") applyTheme(); });
else if (mq.addListener) mq.addListener(() => { if ((state.config.theme || "system") === "system") applyTheme(); });

   ========================================================================= */
function init() {
  loadState();
  applyTheme();
  buildNav();
  $$(".view").forEach(v => v.classList.toggle("active", v.dataset.view === "home"));
  renderHome();
  updateNavState();

  $("#fab").addEventListener("click", openQuickAdd);
  $("#sheetClose").addEventListener("click", closeSheet);
  $("#sheetBackdrop").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  if (!$("#restoreInput")) {
    const ri = document.createElement("input"); ri.type = "file"; ri.id = "restoreInput"; ri.accept = ".json"; ri.style.display = "none";
    ri.addEventListener("change", e => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ""; });
    document.body.appendChild(ri);
  }

  let rt = null;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (state.view === "insights" || state.view === "home") refresh(); }, 220);
  });

  let day = todayISO();
  setInterval(() => {
    const now = todayISO();
    if (now !== day) { day = now; refresh(); }
  }, 60000);

  if (state.config.notifyEnabled && "Notification" in window && Notification.permission === "granted") {
    scheduleReminders();
  }

  initDev();
}

let reminderTimer = null;
function scheduleReminders() {
  if (reminderTimer) clearTimeout(reminderTimer);
  const now = new Date();
  const targets = [];
  const morning = new Date(); morning.setHours(8, 40, 0, 0);
  const afternoon = new Date(); afternoon.setHours(12, 25, 0, 0);
  if (morning > now) targets.push([morning, "InternDoc", "Remember to log your check-in time."]);
  else { const t = new Date(morning); t.setDate(t.getDate() + 1); targets.push([t, "InternDoc", "Remember to log your check-in time."]); }
  if (afternoon > now) targets.push([afternoon, "InternDoc", "Remember to log your check-out time."]);
  else { const t = new Date(afternoon); t.setDate(t.getDate() + 1); targets.push([t, "InternDoc", "Remember to log your check-out time."]); }
  targets.sort((a, b) => a[0] - b[0]);
  const [when, title, body] = targets[0];
  const wait = Math.min(when - now, 2147483000);
  reminderTimer = setTimeout(() => {
    try { if (document.hidden && Notification.permission === "granted") new Notification(title, { body }); } catch (e) {}
    scheduleReminders();
  }, wait);
}

init();
</script>
