<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="InternDoc — a personal biometric attendance companion for interns. Local-only record keeping.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>InternDoc — Personal Attendance</title>
<script>
/* Apply saved theme before first paint to avoid a flash. */
try {
  var _cfg = JSON.parse(localStorage.getItem("interndoc_config_v1") || "{}");
  var _t = _cfg && _cfg.theme || "system";
  var _resolved = _t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : _t;
  document.documentElement.setAttribute("data-theme", _resolved);
} catch (e) {}
</script>
<style>
/* ===================== DESIGN TOKENS ===================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#f7f9fd; --surface-3:#eef3fa;
  --text:#0f172a; --text-2:#54637d; --text-3:#8a99b0;
  --border:#e4eaf3;
  --primary:#2563eb; --primary-ink:#ffffff; --primary-soft:rgba(37,99,235,.10);
  --success:#0d9a66; --success-soft:rgba(13,154,102,.13);
  --half:#d99a06; --half-soft:rgba(217,154,6,.15);
  --pending:#ea7317; --pending-soft:rgba(234,115,23,.15);
  --leave:#2563eb; --leave-soft:rgba(37,99,235,.12);
  --absent:#dc2626; --absent-soft:rgba(220,38,38,.12);
  --holiday:#64748b; --holiday-soft:rgba(100,116,139,.14);
  --neutral:#94a3b8; --neutral-soft:rgba(148,163,184,.16);
  --purple:#7c3aed; --purple-soft:rgba(124,58,237,.12);
  --radius:20px; --radius-sm:14px; --radius-xs:10px;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 12px 32px -16px rgba(15,23,42,.28);
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --nav-h:62px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"], [data-theme="amoled"]{
  --bg:#0a1120; --surface:#131c2e; --surface-2:#182236; --surface-3:#1f2b42;
  --text:#e9eefb; --text-2:#a3b3ce; --text-3:#71829f;
  --border:#243149;
  --primary:#5b8cff; --primary-ink:#08101f; --primary-soft:rgba(91,140,255,.16);
  --success:#34d399; --success-soft:rgba(52,211,153,.16);
  --half:#facc15; --half-soft:rgba(250,204,21,.16);
  --pending:#fb923c; --pending-soft:rgba(251,146,60,.16);
  --leave:#60a5fa; --leave-soft:rgba(96,165,250,.16);
  --absent:#f87171; --absent-soft:rgba(248,113,113,.16);
  --holiday:#94a3b8; --holiday-soft:rgba(148,163,184,.16);
  --neutral:#64748b; --neutral-soft:rgba(100,116,139,.22);
  --purple:#a78bfa; --purple-soft:rgba(167,139,250,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -18px rgba(0,0,0,.85);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
}
[data-theme="amoled"]{
  --bg:#000000; --surface:#0a0a0a; --surface-2:#111111; --surface-3:#191919;
  --border:#1e1e1e;
  --shadow:0 1px 2px rgba(0,0,0,.7), 0 14px 34px -18px rgba(0,0,0,.95);
  --shadow-sm:0 1px 2px rgba(0,0,0,.6);
}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{height:6px;width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ===================== LAYOUT ===================== */
.app{display:flex;min-height:100vh;min-height:100dvh}
.main{flex:1;min-width:0;padding:16px 14px calc(var(--nav-h) + var(--safe-b) + 96px);}
.view{display:none;max-width:1080px;margin:0 auto;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sidebar{display:none}
@media (min-width:960px){
  .main{padding:26px 30px 60px}
  .sidebar{
    display:flex;flex-direction:column;gap:18px;
    width:246px;flex:0 0 246px;padding:22px 16px;
    background:var(--surface);border-right:1px solid var(--border);
    position:sticky;top:0;height:100vh;
  }
}

/* ===================== NAV ===================== */
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.brand-mark{
  width:38px;height:38px;border-radius:12px;flex:0 0 38px;
  background:linear-gradient(140deg,var(--primary),var(--purple));
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.5px;
}
.brand-text strong{display:block;font-size:15px;line-height:1.2}
.brand-text span{font-size:11.5px;color:var(--text-3)}
.side-nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;
  color:var(--text-2);font-weight:600;font-size:14.5px;width:100%;text-align:left;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary)}
.nav-item svg{width:19px;height:19px;flex:0 0 19px}
.side-foot{padding:0 8px}
.disclaimer-mini{font-size:10.5px;line-height:1.5;color:var(--text-3)}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);padding:6px 4px calc(6px + var(--safe-b));
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:12px;color:var(--text-3);font-size:10.5px;font-weight:600;
  transition:color .15s;
}
.bnav-item svg{width:21px;height:21px}
.bnav-item.active{color:var(--primary)}
@media (min-width:960px){.bottom-nav{display:none}}

/* ===================== COMPONENTS ===================== */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:17px;margin-bottom:14px;box-shadow:var(--shadow-sm);
}
.card-lg{padding:19px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.card-head h3{font-size:15px}
.card-head .sub{font-size:12px;color:var(--text-3);font-weight:500;margin-top:2px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}

.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 2px 16px}
.view-head h1{font-size:22px;line-height:1.25}
.view-head .sub{font-size:13px;color:var(--text-2);margin-top:3px}
.avatar{
  width:42px;height:42px;border-radius:14px;flex:0 0 42px;display:grid;place-items:center;
  background:var(--primary-soft);color:var(--primary);font-weight:800;font-size:15px;
}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
}
.pill-success{background:var(--success-soft);color:var(--success)}
.pill-half{background:var(--half-soft);color:var(--half)}
.pill-pending{background:var(--pending-soft);color:var(--pending)}
.pill-leave{background:var(--leave-soft);color:var(--leave)}
.pill-absent{background:var(--absent-soft);color:var(--absent)}
.pill-holiday{background:var(--holiday-soft);color:var(--holiday)}
.pill-neutral{background:var(--neutral-soft);color:var(--text-2)}
.pill-purple{background:var(--purple-soft);color:var(--purple)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 17px;border-radius:14px;font-weight:650;font-size:14px;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  transition:transform .12s,background .15s,opacity .15s;min-height:44px;
}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn-success{background:var(--success);color:#fff;border-color:transparent}
.btn-danger{background:var(--absent-soft);color:var(--absent);border-color:transparent}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;min-height:36px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}

.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:70;
  width:56px;height:56px;border-radius:19px;display:grid;place-items:center;
  background:var(--primary);color:var(--primary-ink);box-shadow:0 10px 26px -8px rgba(37,99,235,.65);
  transition:transform .15s;
}
.fab:active{transform:scale(.92)}
.fab svg{width:24px;height:24px}
@media (min-width:960px){.fab{bottom:28px;right:28px}}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media (max-width:380px){.grid-3{grid-template-columns:1fr 1fr}}

/* Today's biometric card */
.bio-card{
  background:var(--surface);border:1px solid var(--border);border-radius:24px;
  padding:19px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.bio-card::after{
  content:"";position:absolute;inset:0 0 auto auto;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,var(--primary-soft),transparent 68%);transform:translate(45%,-45%);pointer-events:none;
}
.bio-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.bio-times{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:17px 0 6px;position:relative}
.bio-time{text-align:center}
.bio-time .lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.bio-time .val{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.bio-arrow{color:var(--text-3);font-size:16px}
.bio-dur{
  text-align:center;margin:12px 0 15px;padding:10px;border-radius:14px;background:var(--surface-2);
  font-size:14px;font-weight:650;
}
.bio-dur span{color:var(--text-3);font-weight:500;font-size:12.5px;display:block;margin-top:2px}

/* Checklist */
.check-list{display:flex;flex-direction:column;gap:2px}
.check-row{
  display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--border);
  font-size:13.5px;width:100%;text-align:left;border-radius:8px;
}
.check-row:last-child{border-bottom:none}
.check-row:hover{background:var(--surface-2)}
.check-dot{
  width:22px;height:22px;flex:0 0 22px;border-radius:8px;display:grid;place-items:center;
  background:var(--neutral-soft);color:var(--text-3);font-size:12px;font-weight:800;
}
.check-dot.done{background:var(--success-soft);color:var(--success)}
.check-row .lbl{flex:1;font-weight:550}
.check-row .meta{font-size:12px;color:var(--text-3);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Health ring */
.health{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring-wrap{position:relative;width:112px;height:112px;flex:0 0 112px}
.ring{width:112px;height:112px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:var(--surface-3)}
.ring-center{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.05;
}
.ring-center b{font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring-center small{font-size:10px;color:var(--text-3);font-weight:600}
.health-info{flex:1;min-width:170px}
.health-info .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--border)}
.health-info .row:last-child{border-bottom:none}
.health-info .row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}

/* Progress */
.progress{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:11px 0 8px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--purple));transition:width .5s cubic-bezier(.2,.8,.3,1)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2);min-height:36px;
}
.chip.active{background:var(--primary);border-color:transparent;color:var(--primary-ink)}

/* Segmented */
.seg{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:14px;margin-bottom:13px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1;padding:9px 10px;border-radius:11px;font-size:12.5px;font-weight:650;color:var(--text-2);
  white-space:nowrap;min-height:38px;
}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-size:16px;font-weight:700}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--text-3);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal-day{
  aspect-ratio:1/1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--text-2);
  border:1px solid transparent;transition:transform .1s;position:relative;min-height:40px;
}
.cal-day:active{transform:scale(.94)}
.cal-day.empty{background:transparent;pointer-events:none}
.cal-day .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85}
.cal-day.today{border-color:var(--primary);font-weight:800;color:var(--primary)}
.cal-day.s-full{background:var(--success-soft);color:var(--success)}
.cal-day.s-half{background:var(--half-soft);color:var(--half)}
.cal-day.s-leave{background:var(--leave-soft);color:var(--leave)}
.cal-day.s-absent{background:var(--absent-soft);color:var(--absent)}
.cal-day.s-pending{background:var(--pending-soft);color:var(--pending)}
.cal-day.s-holiday{background:var(--holiday-soft);color:var(--holiday)}
.cal-day.s-off{background:transparent;color:var(--text-3);opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;font-size:11.5px;color:var(--text-2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

/* Records */
.record{
  display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);
  width:100%;text-align:left;
}
.record:last-child{border-bottom:none}
.rec-date{flex:0 0 54px;text-align:center}
.rec-date b{display:block;font-size:16px;font-weight:750;letter-spacing:-.02em}
.rec-date span{font-size:10.5px;color:var(--text-3);text-transform:uppercase;font-weight:650}
.rec-main{flex:1;min-width:0}
.rec-times{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.rec-meta{font-size:11.5px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Breakdown bars */
.breakdown{display:flex;flex-direction:column;gap:9px}
.bd-row{display:grid;grid-template-columns:76px 1fr 40px;align-items:center;gap:10px;font-size:12.5px}
.bd-track{height:11px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bd-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bd-val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-2)}

/* Charts */
.chart-box{position:relative;width:100%;min-height:120px}
.chart-box canvas{display:block;width:100%;touch-action:pan-y}
.chart-tip{
  position:absolute;z-index:20;pointer-events:none;background:var(--surface);
  border:1px solid var(--border);border-radius:13px;padding:9px 12px;box-shadow:var(--shadow);
  font-size:12px;min-width:118px;transform:translate(-50%,-108%);transition:opacity .12s;
}
.chart-tip .tt{font-weight:700;font-size:12.5px;margin-bottom:4px}
.chart-tip .tl{display:flex;justify-content:space-between;gap:14px;color:var(--text-2)}
.chart-tip .tl b{color:var(--text);font-variant-numeric:tabular-nums}
.chart-summary{font-size:12.5px;color:var(--text-2);margin:-4px 0 11px;line-height:1.5}
.empty-state{
  text-align:center;padding:26px 14px;color:var(--text-3);font-size:13px;
  border:1px dashed var(--border);border-radius:16px;
}
.empty-state b{display:block;color:var(--text-2);font-size:14px;margin-bottom:5px}

/* Forms */
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:650;color:var(--text-2);margin-bottom:6px}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{
  width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--border);
  background:var(--surface-2);font-size:15px;min-height:46px;
}
.field textarea{min-height:74px;resize:vertical;line-height:1.5}
.field input:disabled{opacity:.6}
.hint{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.5}
.hint.error{color:var(--absent);font-weight:600}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.switch-row:last-child{border-bottom:none}
.switch-row .t{font-size:13.5px;font-weight:600}
.switch-row .d{font-size:11.5px;color:var(--text-3);margin-top:2px}
.switch{position:relative;width:46px;height:27px;flex:0 0 46px}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);transition:.2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + i{background:var(--primary)}
.switch input:checked + i::after{transform:translateX(19px)}
.daypicker{display:flex;gap:6px;flex-wrap:wrap}
.daypicker button{
  width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);
  font-size:12.5px;font-weight:700;color:var(--text-2);
}
.daypicker button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}

/* ===================== SHEET (fixed) ===================== */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(8,14,26,.5);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .22s;z-index:90;
}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--surface);
  border-radius:24px 24px 0 0;max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .28s cubic-bezier(.25,.9,.3,1), opacity .2s, visibility 0s linear .28s;
  padding-bottom:var(--safe-b);box-shadow:0 -12px 40px rgba(0,0,0,.28);
  pointer-events:none;
  visibility:hidden;
}
.sheet.open{
  transform:none;
  pointer-events:auto;
  visibility:visible;
  transition:transform .28s cubic-bezier(.25,.9,.3,1), opacity .2s, visibility 0s;
}
@media (min-width:720px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;border-radius:24px;
    transform:translate(-50%,-46%) scale(.96);opacity:0;max-height:86vh;
    pointer-events:none;visibility:hidden}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;
    pointer-events:auto;visibility:visible}
}

<script>
"use strict";
/* =========================================================================
   InternDoc — personal biometric attendance companion
   All data is stored locally on this device (localStorage). No network calls.
   ========================================================================= */

/* ------------------------------ Utilities ------------------------------ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad2 = n => String(n).padStart(2, "0");
const toISO = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const fromISO = s => { const p = String(s).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 86400000);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW_SHORT = ["S","M","T","W","T","F","S"];

const toMin = t => { if (!t) return null; const p = String(t).split(":").map(Number); if (isNaN(p[0])) return null; return p[0] * 60 + (p[1] || 0); };
const fmt12 = t => {
  const m = toMin(t); if (m == null) return "—";
  let h = Math.floor(m / 60); const mm = pad2(m % 60); const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12; return pad2(h) + ":" + mm + " " + ap;
};
const fmtDur = mins => {
  if (mins == null || isNaN(mins) || mins <= 0) return "—";
  const h = Math.floor(mins / 60), m = Math.round(mins % 60);
  return h ? h + "h " + m + "m" : m + "m";
};
const fmtLong = iso => { const d = fromISO(iso); return DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); };
const fmtShort = iso => { const d = fromISO(iso); return d.getDate() + " " + MON_SHORT[d.getMonth()]; };
const monthLabel = key => { const [y, m] = key.split("-").map(Number); return MON_SHORT[m - 1] + " " + String(y).slice(2); };

/* ------------------------------ Icons ------------------------------ */
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.6 12 3.5l9 7.1"/><path d="M5.5 9.6V20h13V9.6"/><path d="M10 20v-5h4v5"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  insights: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l3.5-4.5 3 2.5L20 6"/></svg>',
  records: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="12" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 5.5V20.5"/></svg>',
  stethoscope: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v3a5 5 0 0 0 5 5 4 4 0 0 0 4-4v-2"/><circle cx="19" cy="12" r="2"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h9l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V8"/><path d="m7 12 5-5 5 5"/><path d="M5 4h14"/></svg>',
  award: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5.5"/><path d="m8.5 14-1.5 7 5-2.6 5 2.6-1.5-7"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>'
};

/* ------------------------------ Defaults ------------------------------ */
const DEFAULT_HOLIDAYS = {
  "2026-01-26": "Republic Day",
  "2026-03-03": "Rakshabandhan",
  "2026-04-14": "Ambedkar Jayanti",
  "2026-08-15": "Independence Day",
  "2026-08-28": "Dussehra",
  "2026-10-02": "Mahatma Gandhi Jayanti",
  "2026-10-20": "Deepawali",
  "2026-11-08": "Deepawali Holidays",
  "2026-11-09": "Deepawali Holidays",
  "2026-11-10": "Deepawali Holidays"
};

const DEFAULT_CONFIG = {
  requiredPercent: 90,
  leaveAllowance: 15,
  internshipStart: "",
  internshipEnd: "",
  inStart: "08:45", inEnd: "09:05",
  outStart: "12:30", outEnd: "12:45",
  workDays: [1, 2, 3, 4, 5, 6],
  organization: "", department: "",
  theme: "system",
  notifyEnabled: false,
  migrated: false
};

const QUOTES = [
  { t: "Wherever the art of Medicine is loved, there is also a love of Humanity.", a: "Hippocrates" },
  { t: "The good physician treats the disease; the great physician treats the patient who has the disease.", a: "William Osler" },
  { t: "To cure sometimes, to relieve often, to comfort always.", a: "Hippocrates" },
  { t: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", a: "Aristotle" },
  { t: "The best preparation for tomorrow is to do today's work superbly well.", a: "William Osler" },
  { t: "The secret of patient care is caring for the patient.", a: "Francis W. Peabody" },
  { t: "You have power over your mind — not outside events. Realize this, and you will find strength.", a: "Marcus Aurelius" },
  { t: "It is much more important to know what sort of a patient has a disease than what sort of a disease a patient has.", a: "William Osler" },
  { t: "The first wealth is health.", a: "Ralph Waldo Emerson" },
  { t: "One of the first duties of the physician is to educate the masses not to take medicine.", a: "William Osler" }
];

/* ------------------------------ State ------------------------------ */
const state = {
  view: "home",
  config: Object.assign({}, DEFAULT_CONFIG, { workDays: DEFAULT_CONFIG.workDays.slice() }),
  profile: { name: "", organization: "", department: "" },
  holidays: {},
  records: [],
  streak: { last: null, count: 0 },
  calMonth: null,
  insRange: "30",
  recTab: "biometric",
  search: "",
  statusFilter: "all"
};

/* ------------------------------ Developer mode ------------------------------ */
const DEV = {
  enabled: false,
  dateOffset: 0,        // integer days relative to real today
  timeOverride: null,   // "HH:MM" or null
  panelEl: null,
  minimized: false
};

/** Returns the effective "now" for the whole app — respects DEV overrides. */
function nowDate() {
  const d = new Date();
  if (DEV.enabled) {
    if (DEV.dateOffset) d.setDate(d.getDate() + DEV.dateOffset);
    if (DEV.timeOverride) {
      const parts = DEV.timeOverride.split(":").map(Number);
      if (!isNaN(parts[0])) d.setHours(parts[0], isNaN(parts[1]) ? 0 : parts[1], 0, 0);
    }
  }
  return d;
}
const todayISO = () => toISO(nowDate());

const KEYS = {
  config: "interndoc_config_v1",
  profile: "interndoc_profile_v1",
  holidays: "interndoc_holidays_v1",
  records: "interndoc_records_v1",
  streak: "interndoc_streak_v1",
  legacyRecords: "attendance_records",
  legacyLeaves: "attendance_leaves",
  legacyStart: "internship_start_date",
  legacyName: "saved_intern_name"
};

function safeParse(str, fallback) {
  try { const v = JSON.parse(str); return v == null ? fallback : v; } catch (e) { return fallback; }
}

/* ------------------------------ Persistence ------------------------------ */
function saveRecords() { try { localStorage.setItem(KEYS.records, JSON.stringify(state.records)); } catch (e) { toast("Storage full — export a backup and clear old records.", true); } }
function saveConfig() { try { localStorage.setItem(KEYS.config, JSON.stringify(state.config)); } catch (e) {} }
function saveProfile() { try { localStorage.setItem(KEYS.profile, JSON.stringify(state.profile)); } catch (e) {} }
function saveHolidays() { try { localStorage.setItem(KEYS.holidays, JSON.stringify(state.holidays)); } catch (e) {} }
function saveStreak() { try { localStorage.setItem(KEYS.streak, JSON.stringify(state.streak)); } catch (e) {} }

function loadState() {
  const savedCfg = safeParse(localStorage.getItem(KEYS.config), {});
  state.config = Object.assign({}, DEFAULT_CONFIG, savedCfg);
  if (!Array.isArray(state.config.workDays)) state.config.workDays = DEFAULT_CONFIG.workDays.slice();
  else state.config.workDays = state.config.workDays.slice();

  state.profile = Object.assign({ name: "", organization: "", department: "" }, safeParse(localStorage.getItem(KEYS.profile), {}));
  const h = safeParse(localStorage.getItem(KEYS.holidays), null);
  state.holidays = h && typeof h === "object" ? h : { ...DEFAULT_HOLIDAYS };
  state.streak = Object.assign({ last: null, count: 0 }, safeParse(localStorage.getItem(KEYS.streak), {}));

  let recs = safeParse(localStorage.getItem(KEYS.records), null);
  if (!Array.isArray(recs)) {
    const legacy = safeParse(localStorage.getItem(KEYS.legacyRecords), []);
    recs = Array.isArray(legacy) ? legacy.map(migrateLegacy) : [];
    state.config.migrated = true;
  }
  state.records = recs.filter(r => r && r.date).map(normaliseRecord);

  if (!state.profile.name) {
    const n = localStorage.getItem(KEYS.legacyName);
    if (n) state.profile.name = n;
    else {
      const first = state.records.find(r => r.name);
      if (first) state.profile.name = first.name;
    }
  }
  if (!state.config.internshipStart) {
    const s = localStorage.getItem(KEYS.legacyStart);
    if (s) state.config.internshipStart = s;
  }
  if (!state.config.migrated) {
    const legacyLeaves = safeParse(localStorage.getItem(KEYS.legacyLeaves), {});
    const year = new Date().getFullYear();
    const key = (state.profile.name || "") + "|" + year;
    if (typeof legacyLeaves[key] === "number") {
      const used = leaveUsedAll();
      state.config.leaveAllowance = Math.max(0, legacyLeaves[key] + used);
    }
    state.config.migrated = true;
  }
  saveConfig();
  saveRecords();
}

function migrateLegacy(r) {
  const isHol = !!(r.date && DEFAULT_HOLIDAYS[r.date]);
  return {
    id: uid(), date: r.date, name: r.name || "",
    checkIn: r.checkInTime || "", checkOut: r.checkOutTime || "",
    isLeave: r.status === "Leave",
    isAbsent: r.status === "Absent" && !isHol,
    leaveReason: r.leaveReason || "", learning: r.learning || "",
    remarks: r.remarks || r.remark || "",
    referrals: Array.isArray(r.referrals) ? r.referrals : [],
    rating: r.rating || 0, photo: r.photo || null, audit: [], createdAt: null
  };
}

function normaliseRecord(r) {
  return {
    id: r.id || uid(),
    date: r.date,
    name: r.name || "",
    checkIn: r.checkIn || "",
    checkOut: r.checkOut || "",
    isLeave: !!r.isLeave,
    isAbsent: !!r.isAbsent,
    leaveReason: r.leaveReason || "",
    learning: r.learning || "",
    remarks: r.remarks || "",
    referrals: Array.isArray(r.referrals) ? r.referrals : [],
    rating: Number(r.rating) || 0,
    photo: r.photo || null,
    audit: Array.isArray(r.audit) ? r.audit : [],
    createdAt: r.createdAt || null,
    updatedAt: r.updatedAt || null
  };
}

/* ------------------------------ Rules engine ------------------------------ */
function isHoliday(iso) { return state.holidays[iso] || null; }
function isWorkingDay(iso) {
  const d = fromISO(iso).getDay();
  return state.config.workDays.indexOf(d) !== -1;
}
function myRecords() {
  const n = state.profile.name || "";
  return state.records.filter(r => (r.name || "") === n);
}
function getRecord(iso) {
  const n = state.profile.name || "";
  return state.records.find(r => r.date === iso && (r.name || "") === n) || null;
}

function statusFor(iso, rec) {
  if (isHoliday(iso)) return "Holiday";
  if (!isWorkingDay(iso)) return "Off Day";
  if (rec) {
    if (rec.isLeave) return "Leave";
    if (rec.isAbsent) return "Absent";
    if (rec.checkIn && rec.checkOut) return isFullDay(rec) ? "Full Day" : "Half Day";
    if (rec.checkIn) return "Checked In";
    if (rec.checkOut) return "Half Day";
  }
  const t = todayISO();
  if (iso > t) return "Upcoming";
  if (iso === t) return "Not Recorded";
  return "Pending";
}

function isFullDay(rec) {
  const ci = toMin(rec.checkIn), co = toMin(rec.checkOut);
  if (ci == null || co == null) return false;
  const c = state.config;
  const inOk = ci >= toMin(c.inStart) && ci <= toMin(c.inEnd);
  const outOk = co >= toMin(c.outStart) && co <= toMin(c.outEnd);
  return inOk && outOk;
}

function workMinutes(rec) {
  if (!rec) return 0;
  const ci = toMin(rec.checkIn), co = toMin(rec.checkOut);
  if (ci == null || co == null) return 0;
  let m = co - ci;
  if (m < 0) m += 1440;
  return m;
}

function leaveCost(iso, rec) {
  const s = statusFor(iso, rec);
  if (s === "Half Day") return 0.5;
  if (s === "Leave") return 1;
  if (s === "Absent") return 1;
  return 0;
}

function leaveUsedAll() {
  let used = 0;
  for (const r of myRecords()) {
    const s = statusFor(r.date, r);
    if (s === "Half Day") used += 0.5;
    else if (s === "Leave") used += 1;
    else if (s === "Absent") used += 1;
  }
  return used;
}

/* ------------------------------ Statistics ------------------------------ */
function eachDay(from, to) {
  const out = []; let cur = fromISO(from); const end = fromISO(to);
  let guard = 0;
  while (cur <= end && guard++ < 4000) { out.push(toISO(cur)); cur = addDayDate(cur); }
  return out;
}
function addDayDate(d) { const x = new Date(d.getTime()); x.setDate(x.getDate() + 1); return x; }

function computeStats(from, to) {
  const today = todayISO();
  const eff = to > today ? today : to;
  const s = { working: 0, full: 0, half: 0, leave: 0, absent: 0, pending: 0, credit: 0, minutes: 0, percent: 0, recorded: 0 };
  if (eff < from) return s;
  for (const d of eachDay(from, eff)) {
    if (!isWorkingDay(d)) continue;
    if (isHoliday(d)) continue;
    s.working++;
    const rec = getRecord(d);
    const st = statusFor(d, rec);
    if (st === "Full Day") { s.full++; s.credit += 1; s.minutes += workMinutes(rec); s.recorded++; }
    else if (st === "Half Day" || st === "Checked In") { s.half++; s.credit += 0.5; s.minutes += workMinutes(rec); s.recorded++; }
    else if (st === "Leave") { s.leave++; }
    else if (st === "Absent") { s.absent++; }
    else if (st === "Pending") { s.pending++; }
  }
  s.percent = s.working ? (s.credit / s.working) * 100 : 0;
  return s;
}

function monthlyStats(from, to) {
  const today = todayISO();
  const eff = to > today ? today : to;
  const map = new Map();
  for (const d of eachDay(from, eff)) {
    const k = d.slice(0, 7);
    if (!map.has(k)) map.set(k, { key: k, working: 0, credit: 0, full: 0, half: 0, leave: 0, absent: 0, pending: 0, minutes: 0 });
    const m = map.get(k);
    if (!isWorkingDay(d)) continue;
    if (isHoliday(d)) continue;
    m.working++;
    const rec = getRecord(d); const st = statusFor(d, rec);
    if (st === "Full Day") { m.full++; m.credit += 1; m.minutes += workMinutes(rec); }
    else if (st === "Half Day" || st === "Checked In") { m.half++; m.credit += 0.5; m.minutes += workMinutes(rec); }
    else if (st === "Leave") m.leave++;
    else if (st === "Absent") m.absent++;
    else if (st === "Pending") m.pending++;
  }
  const arr = Array.from(map.values()).sort((a, b) => a.key.localeCompare(b.key));
  arr.forEach(m => { m.percent = m.working ? (m.credit / m.working) * 100 : 0; });
  return arr;
}

function leaveSummary() {
  const allowance = Number(state.config.leaveAllowance) || 0;
  let used = 0, pendingCount = 0;
  for (const r of myRecords()) {
    const s = statusFor(r.date, r);
    if (s === "Half Day") used += 0.5;
    else if (s === "Leave") used += 1;
    else if (s === "Absent") used += 1;
    else if (s === "Pending") pendingCount++;
  }
  return { allowance, used, remaining: allowance - used, pending: pendingCount };
}

function internshipRange() {
  const c = state.config;
  let start = c.internshipStart;
  if (!start) {
    const dates = myRecords().map(r => r.date).sort();
    start = dates.length ? dates[0] : todayISO();
  }
  let end = c.internshipEnd;
  if (!end) {
    const d = fromISO(start); d.setFullYear(d.getFullYear() + 1); d.setDate(d.getDate() - 1);
    end = toISO(d);
  }
  return { start, end };
}

function internshipProgress() {
  const { start, end } = internshipRange();
  const today = todayISO();
  const total = Math.max(1, diffDays(start, end) + 1);
  const elapsed = clamp(diffDays(start, today) + 1, 0, total);
  return { start, end, total, elapsed, remaining: Math.max(0, total - elapsed), percent: (elapsed / total) * 100 };
}

function countWorkingDays(from, to) {
  if (to < from) return 0;
  let n = 0;
  for (const d of eachDay(from, to)) if (isWorkingDay(d) && !isHoliday(d)) n++;
  return n;
}

/* =========================================================================
   CHARTS
   ========================================================================= */
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function prepCanvas(canvas, height) {
  const box = canvas.parentElement;
  const w = Math.max(240, Math.floor(box.clientWidth));
  const h = height || 200;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

function niceTicks(min, max, count) {
  const span = max - min || 1;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  let step = mag * (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10);
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 0.001; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}

function bindChart(canvas) {
  if (canvas._bound) return;
  canvas._bound = true;
  const box = canvas.parentElement;
  const tip = box.querySelector(".chart-tip");
  const find = (clientX, clientY) => {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left, y = clientY - rect.top;
    const hits = canvas._hits || [];
    let best = null, bd = 1e9;
    for (const p of hits) {
      const dx = p.x - x, dy = (p.y - y) * 1.4;
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = p; }
    }
    return bd <= 900 ? best : null;
  };
  const show = (clientX, clientY) => {
    if (!tip) return;
    const hit = find(clientX, clientY);
    if (!hit) { tip.style.opacity = "0"; return; }
    let html = '<div class="tt">' + esc(hit.title) + "</div>";
    (hit.lines || []).forEach(l => { html += '<div class="tl"><span>' + esc(l[0]) + "</span><b>" + esc(l[1]) + "</b></div>"; });
    tip.innerHTML = html;
    tip.style.opacity = "1";
    const boxRect = box.getBoundingClientRect();
    tip.style.left = clamp(hit.x, 62, boxRect.width - 62) + "px";
    const th = tip.offsetHeight || 60;
    tip.style.top = Math.max(hit.y, th * 1.15 + 6) + "px";
  };
  const hide = () => { if (tip) tip.style.opacity = "0"; };
  canvas.addEventListener("mousemove", e => show(e.clientX, e.clientY));
  canvas.addEventListener("mouseleave", hide);
  canvas.addEventListener("touchstart", e => { if (e.touches[0]) show(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  canvas.addEventListener("touchmove", e => { if (e.touches[0]) show(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  canvas.addEventListener("touchend", () => setTimeout(hide, 2200));
}

function chartLine(canvas, cfg) {
  const { ctx, w, h } = prepCanvas(canvas, cfg.height || 200);
  const pts = (cfg.points || []).filter(p => p.value != null && !isNaN(p.value));
  canvas._hits = [];
  bindChart(canvas);
  if (!pts.length) return;
  const padL = cfg.padL || 46, padR = 14, padT = 14, padB = 26;
  const cw = w - padL - padR, ch = h - padT - padB;
  let vals = pts.map(p => p.value);
  let min = cfg.min != null ? cfg.min : Math.min(...vals);
  let max = cfg.max != null ? cfg.max : Math.max(...vals);
  if (cfg.threshold != null) { min = Math.min(min, cfg.threshold); max = Math.max(max, cfg.threshold); }
  if (max - min < 1e-9) { max = min + 1; }
  const pad = (max - min) * 0.14;
  min -= pad; max += pad;
  if (cfg.minZero && cfg.min == null) min = Math.min(0, min);
  if (cfg.min != null) min = cfg.min;
  if (cfg.max != null) max = cfg.max;
  const ticks = niceTicks(min, max, 4);
  const tMin = ticks[0], tMax = ticks[ticks.length - 1] || tMin + 1;
  const X = i => pts.length === 1 ? padL + cw / 2 : padL + (i / (pts.length - 1)) * cw;
  const Y = v => padT + ch - ((v - tMin) / (tMax - tMin || 1)) * ch;
  const cText = cssVar("--text-3"), cGrid = cssVar("--border"), cLine = cfg.color || cssVar("--primary");
  ctx.font = "10px -apple-system,system-ui,sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ticks.forEach(t => {
    const y = Y(t);
    ctx.strokeStyle = cGrid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = cText;
    ctx.fillText(cfg.formatY ? cfg.formatY(t) : String(Math.round(t)), padL - 8, y);
  });
  if (cfg.threshold != null && cfg.threshold >= tMin && cfg.threshold <= tMax) {
    const y = Y(cfg.threshold);
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = cssVar("--pending"); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = cssVar("--pending");
    ctx.textAlign = "left"; ctx.font = "600 9.5px -apple-system,system-ui,sans-serif";
    ctx.fillText(cfg.thresholdLabel || "Required", padL + 4, y - 8);
  }
  if (pts.length >= 2) {
    ctx.beginPath();
    pts.forEach((p, i) => { const x = X(i), y = Y(p.value); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.lineTo(X(pts.length - 1), padT + ch);
    ctx.lineTo(X(0), padT + ch);
    ctx.closePath();
    ctx.globalAlpha = 0.12; ctx.fillStyle = cLine; ctx.fill(); ctx.globalAlpha = 1;
    ctx.beginPath();
    pts.forEach((p, i) => { const x = X(i), y = Y(p.value); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.strokeStyle = cLine; ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.stroke();
  }
  pts.forEach((p, i) => {
    const x = X(i), y = Y(p.value);
    ctx.beginPath(); ctx.arc(x, y, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = cssVar("--surface"); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = cLine; ctx.stroke();
    canvas._hits.push({ x, y, title: p.title || p.label, lines: p.lines || [] });
  });
  const maxLabels = w < 380 ? 3 : w < 560 ? 4 : 6;
  const step = Math.max(1, Math.ceil(pts.length / maxLabels));
  ctx.fillStyle = cText; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.font = "10px -apple-system,system-ui,sans-serif";
  pts.forEach((p, i) => {
    if (pts.length === 1) { ctx.fillText(p.label, X(0), padT + ch + 7); return; }
    if (i % step !== 0 && i !== pts.length - 1) return;
    if (i !== pts.length - 1 && (pts.length - 1 - i) < step * 0.6) return;
    ctx.fillText(p.label, X(i), padT + ch + 7);
  });
}

function chartBar(canvas, cfg) {
  const { ctx, w, h } = prepCanvas(canvas, cfg.height || 200);
  const pts = (cfg.points || []).filter(p => p.value != null && !isNaN(p.value));
  canvas._hits = [];
  bindChart(canvas);
  if (!pts.length) return;
  const padL = cfg.padL || 46, padR = 14, padT = 14, padB = 26;
  const cw = w - padL - padR, ch = h - padT - padB;
  let max = Math.max(...pts.map(p => p.value), 0);
  const ticks = niceTicks(0, max || 1, 4);
  const tMax = ticks[ticks.length - 1] || 1;
  const Y = v => padT + ch - (v / tMax) * ch;
  const cText = cssVar("--text-3"), cGrid = cssVar("--border"), cBar = cfg.color || cssVar("--primary");
  ctx.font = "10px -apple-system,system-ui,sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ticks.forEach(t => {
    const y = Y(t);
    ctx.strokeStyle = cGrid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = cText;
    ctx.fillText(cfg.formatY ? cfg.formatY(t) : String(Math.round(t)), padL - 8, y);
  });
  const slot = cw / pts.length;
  const bw = Math.min(slot * 0.62, 40);
  pts.forEach((p, i) => {
    const cx = padL + slot * i + slot / 2;
    const y = Y(p.value);
    const r = Math.min(7, bw / 2);
    ctx.beginPath();
    ctx.moveTo(cx - bw / 2, padT + ch);
    ctx.lineTo(cx - bw / 2, y + r);
    ctx.quadraticCurveTo(cx - bw / 2, y, cx - bw / 2 + r, y);
    ctx.lineTo(cx + bw / 2 - r, y);
    ctx.quadraticCurveTo(cx + bw / 2, y, cx + bw / 2, y + r);
    ctx.lineTo(cx + bw / 2, padT + ch);
    ctx.closePath();
    ctx.fillStyle = cBar;
    ctx.globalAlpha = 0.92; ctx.fill(); ctx.globalAlpha = 1;
    canvas._hits.push({ x: cx, y, title: p.title || p.label, lines: p.lines || [] });
    ctx.fillStyle = cText; ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillText(p.label, cx, padT + ch + 7);
  });
}

function seedSampleData() {
  const name = state.profile.name || "Test Intern";
  state.profile.name = name;
  if (!state.config.internshipStart) {
    const d = new Date(); d.setMonth(d.getMonth() - 2);
    state.config.internshipStart = toISO(d);
  }
  const added = [];
  for (let i = 1; i <= 30; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    if (d.getDay() === 0) continue;
    const iso = toISO(d);
    if (state.records.find(r => r.date === iso && r.name === name)) continue;
    const cm = 45 + Math.floor(Math.random() * 18); // 45–62
    const com = 30 + Math.floor(Math.random() * 14); // 30–43
    added.push(normaliseRecord({
      id: uid(), date: iso, name,
      checkIn: "08:" + pad2(Math.min(59, cm)),
      checkOut: "12:" + pad2(Math.min(59, com)),
      learning: (i % 4 === 0) ? "Observed ward rounds and assisted with dressings." : "",
      remarks: (i % 6 === 0) ? "Busy OPD day." : "",
      referrals: [], rating: 0
    }));
  }
  state.records.push(...added);
  saveProfile(); saveConfig(); saveRecords();
  refresh();
  toast("Seeded " + added.length + " sample records");
}

    <div>
      <h1>${greeting()}, ${esc((state.profile.name || "Intern").split(" ")[0])}</h1>
      <div class="sub">${fmtLong(today)}</div>
    </div>
    <div class="avatar" aria-hidden="true">${esc(initials)}</div>
  </div>

    <div style="display:flex;gap:11px;align-items:flex-start;">
      <span style="font-size:18px;">⏳</span>

    <div class="bio-top">

      <span class="pill ${statusPillClass(hol ? "Holiday" : st)}">${esc(hol ? "Holiday" : st)}</span>

    <div class="bio-times">
