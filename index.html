<script>
    // ==================== QUOTES ====================
    const QUOTES = [
        { text: "Wherever the art of Medicine is loved, there is also a love of Humanity.", author: "Hippocrates" },
        { text: "The physician must be able to tell the antecedents, know the present, and foretell the future.", author: "Hippocrates" },
        { text: "The good physician treats the disease; the great physician treats the patient who has the disease.", author: "William Osler" },
        { text: "The best preparation for tomorrow is to do today's work superbly well.", author: "William Osler" },
        { text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Aristotle" },
        { text: "It is not death that a man should fear, but he should fear never beginning to live.", author: "Marcus Aurelius" },
        { text: "You have power over your mind – not outside events. Realize this, and you will find strength.", author: "Marcus Aurelius" },
        { text: "It's not what happens to you, but how you react to it that matters.", author: "Epictetus" },
        { text: "He who has a why to live for can bear almost any how.", author: "Friedrich Nietzsche" },
        { text: "The greatest medicine of all is to teach people how not to need it.", author: "Hippocrates" },
        { text: "A physician is obligated to consider more than a diseased organ, more than the whole man – he must see the man in his world.", author: "Albert Schweitzer" },
        { text: "To cure sometimes, to relieve often, to comfort always.", author: "Hippocrates" },
        { text: "The secret of patient care is caring for the patient.", author: "Francis W. Peabody" },
        { text: "The patient is the center of the medical universe.", author: "William Osler" },
        { text: "It is much more important to know what sort of a patient has a disease than what sort of a disease a patient has.", author: "William Osler" },
        { text: "The art of medicine consists of amusing the patient while nature cures the disease.", author: "Voltaire" },
        { text: "A wise man ought to realize that health is his most valuable possession.", author: "Hippocrates" },
        { text: "One of the first duties of the physician is to educate the masses not to take medicine.", author: "William Osler" },
        { text: "The first wealth is health.", author: "Ralph Waldo Emerson" },
        { text: "The natural healing force within each one of us is the greatest force in getting well.", author: "Hippocrates" },
        { text: "Let food be thy medicine and medicine be thy food.", author: "Hippocrates" },
        { text: "The doctor of the future will give no medication, but will interest his patients in the care of the human frame, diet, and in the cause and prevention of disease.", author: "Thomas Edison" },
        { text: "The greatest mistake in the treatment of diseases is that there are physicians for the body and physicians for the soul, although the two cannot be separated.", author: "Plato" },
        { text: "The most important thing in illness is never to lose heart.", author: "Nikolai Lenin" },
        { text: "You cannot teach a man anything; you can only help him find it within himself.", author: "Galileo Galilei" }
    ];

    function getDailyQuote() {
        const today = new Date();
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
        const index = dayOfYear % QUOTES.length;
        return QUOTES[index];
    }

    // ==================== HOLIDAYS 2026 ====================
    const HOLIDAYS_2026 = {
        "2026-01-26": "Republic Day",
        "2026-04-14": "Ambedkar Jayanti",
        "2026-08-15": "Independence Day",
        "2026-10-02": "Mahatma Gandhi's Jayanti",
        "2026-03-03": "Rakshabandhan",
        "2026-08-28": "Dussehra",
        "2026-10-20": "Deepawali",
        "2026-11-08": "Deepawali Holidays",
        "2026-11-09": "Deepawali Holidays",
        "2026-11-10": "Deepawali Holidays"
    };
    function isHoliday(dateStr) { return HOLIDAYS_2026[dateStr] || false; }

    // ==================== SUNDAY CHECK ====================
    function isSunday(dateStr) {
        return new Date(dateStr).getDay() === 0;
    }

    // ==================== PUSH NOTIFICATIONS ====================
    let notificationPermission = false;
    function requestNotificationPermission() {
        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    notificationPermission = true;
                    document.getElementById("permStatus").innerText = "✅ Allowed";
                    showToast("Notifications enabled!");
                } else {
                    document.getElementById("permStatus").innerText = "❌ Blocked";
                }
            });
        } else {
            document.getElementById("permStatus").innerText = "Not supported";
        }
    }
    function sendNotification(title, body, tag = null) {
        if (notificationPermission && document.hasFocus() === false) {
            const options = { body, icon: "https://img.icons8.com/color/48/checked-checkbox.png", vibrate: [200,100,200] };
            if (tag) options.tag = tag;
            new Notification(title, options);
        } else if (notificationPermission && document.hasFocus()) {
            showToast(`🔔 ${title}: ${body}`);
        }
    }
    function scheduleReminders() {
        const now = new Date();
        const morning = new Date(); morning.setHours(8,40,0,0);
        const afternoon = new Date(); afternoon.setHours(12,25,0,0);
        const schedule = (time, title, body, tag) => {
            const diff = time - now;
            if (diff > 0) {
                setTimeout(() => {
                    sendNotification(title, body, tag);
                    setInterval(() => {
                        const next = new Date(); next.setDate(next.getDate()+1); next.setHours(time.getHours(), time.getMinutes(), 0, 0);
                        const wait = next - new Date();
                        setTimeout(() => sendNotification(title, body, tag), wait);
                    }, 24*60*60*1000);
                }, diff);
            } else {
                const next = new Date(); next.setDate(next.getDate()+1); next.setHours(time.getHours(), time.getMinutes(), 0, 0);
                const wait = next - now;
                setTimeout(() => sendNotification(title, body, tag), wait);
            }
        };
        schedule(morning, "🌅 Morning Reminder", "Time to check in!", "morning");
        schedule(afternoon, "🌤️ Afternoon Reminder", "Time to check out!", "afternoon");
    }

    // ==================== DATA ====================
    let currentIntern = "", allRecords = [], leavesMap = {}, streakData = { lastCheckInDate: null, currentStreak: 0 }, internshipStartDate = null, lastAbsentCheckDate = "";
    let currentRange = 30, customStartDate = "", customEndDate = "";
    let photoData = null;
    let testModeEnabled = false, simulatedTime = "09:00:00", simulatedDateOffset = 0;
    const ADMIN_PASSWORD = "admin123";

    // Helper
    function getRealTodayStr() { return new Date().toISOString().slice(0,10); }
    function getTodayStr() {
        if (testModeEnabled && simulatedDateOffset !== 0) {
            let d = new Date(); d.setDate(d.getDate() + simulatedDateOffset);
            return d.toISOString().slice(0,10);
        }
        return getRealTodayStr();
    }
    function getCurrentTimeStr() {
        if (testModeEnabled) return simulatedTime;
        return new Date().toTimeString().slice(0,8);
    }

    function getStatus(checkIn, checkOut) {
        if (!checkIn) return "Absent";
        if (isHoliday(getTodayStr())) return "Absent";
        let [hIn, mIn] = checkIn.split(":").map(Number);
        let inMins = hIn*60 + mIn;
        let morningStart = 8*60+45, morningEnd = 9*60+5;
        let isMorningOnTime = inMins >= morningStart && inMins <= morningEnd;
        if (!checkOut) return "Half Day";
        let [hOut, mOut] = checkOut.split(":").map(Number);
        let outMins = hOut*60 + mOut;
        let afternoonStart = 12*60+30, afternoonEnd = 12*60+45;
        let isAfternoonOnTime = outMins >= afternoonStart && outMins <= afternoonEnd;
        if (isMorningOnTime && isAfternoonOnTime) return "Full Day";
        return "Half Day";
    }

    function getLeavesConsumed(status) {
        if (status === "Full Day") return 0;
        if (status === "Half Day") return 0.5;
        if (status === "Absent") return 1;
        return 0;
    }

    function updateButtonState() {
        let inBtn = document.getElementById("checkInBtn"), outBtn = document.getElementById("checkOutBtn"), warn = document.getElementById("windowWarning");
        if(!inBtn) return;
        inBtn.disabled = false;
        outBtn.disabled = false;
        warn.innerHTML = "✅ Check In/Out anytime. Status determined by your timing.";
    }

    // Storage
    function loadData() {
        let stored = localStorage.getItem("attendance_records"); if(stored) allRecords = JSON.parse(stored);
        stored = localStorage.getItem("attendance_leaves"); if(stored) leavesMap = JSON.parse(stored); else leavesMap = {};
        let savedName = localStorage.getItem("saved_intern_name"); if(savedName) { document.getElementById("internName").value = savedName; currentIntern = savedName; }
        stored = localStorage.getItem("attendance_streak"); if(stored) streakData = JSON.parse(stored); else streakData = { lastCheckInDate: null, currentStreak: 0 };
        internshipStartDate = localStorage.getItem("internship_start_date"); if(internshipStartDate) document.getElementById("startDateInput").value = internshipStartDate;
        let dark = localStorage.getItem("dark_mode"); if(dark === "true") document.body.classList.add("dark");
        let currentYear = new Date().getFullYear();
        for(let key in leavesMap) { let [name, year] = key.split("|"); if(parseInt(year) !== currentYear) delete leavesMap[key]; }
        saveLeaves(); updateStreakDisplay(); autoMarkAbsent(); updateButtonState();
        const daily = getDailyQuote();
        document.getElementById("quoteText").innerText = `"${daily.text}"`;
        document.getElementById("quoteAuthor").innerText = `— ${daily.author}`;
        loadReferralsForToday();
    }
    function saveRecords() { localStorage.setItem("attendance_records", JSON.stringify(allRecords)); }
    function saveLeaves() { localStorage.setItem("attendance_leaves", JSON.stringify(leavesMap)); }
    function saveStreak() { localStorage.setItem("attendance_streak", JSON.stringify(streakData)); }

    function getRemainingLeaves(name) { let year=new Date().getFullYear(), key=`${name}|${year}`; if(!leavesMap[key]) leavesMap[key]=15; return leavesMap[key]; }
    function setRemainingLeaves(name, newRemaining) { let year=new Date().getFullYear(), key=`${name}|${year}`; leavesMap[key]=newRemaining; saveLeaves(); }
    function deductLeave(name, amount) { let rem=getRemainingLeaves(name), newRem=rem-amount; setRemainingLeaves(name,newRem); return newRem; }

    function autoMarkAbsent() {
        let today=getTodayStr(); if(lastAbsentCheckDate===today || !currentIntern) return;
        lastAbsentCheckDate=today; let name=currentIntern, datesWithAttendance=new Set(allRecords.filter(r=>r.name===name).map(r=>r.date));
        let checkDate=new Date(); checkDate.setDate(checkDate.getDate()-1);
        let startDate=internshipStartDate?new Date(internshipStartDate):new Date(checkDate.getFullYear(),0,1);
        let absentCount=0;
        while(checkDate>=startDate && absentCount<30) {
            let dateStr=checkDate.toISOString().slice(0,10);
            if (isSunday(dateStr)) {
                checkDate.setDate(checkDate.getDate() - 1);
                continue;
            }
            if(!datesWithAttendance.has(dateStr) && !allRecords.some(r=>r.name===name && r.date===dateStr && (r.status==="Leave"||r.status==="Absent"))) {
                if(!isHoliday(dateStr)) { deductLeave(name,1); }
                allRecords.push({date:dateStr,name:name,checkInTime:"",checkOutTime:"",status:"Absent",leavesConsumed:isHoliday(dateStr)?0:1,remark:isHoliday(dateStr)?"Holiday - no leave":"Auto-marked absent",learning:"",leaveDays:0,leaveReason:"",referrals:[],rating:0,remarks:""});
                absentCount++;
                if(getRemainingLeaves(name)<0) showDangerZone(name);
            }
            checkDate.setDate(checkDate.getDate()-1);
        }
        if(absentCount>0) { saveRecords(); updateUI(name); showToast(`Auto-marked ${absentCount} absent day(s).`); }
    }

    function updateStreakAfterCheckIn(dateStr) {
        let last=streakData.lastCheckInDate;
        if(!last) streakData.currentStreak=1;
        else { let diff=(new Date(dateStr)-new Date(last))/(1000*60*60*24); if(diff===1) streakData.currentStreak++; else if(diff>1) streakData.currentStreak=1; }
        streakData.lastCheckInDate=dateStr; saveStreak(); updateStreakDisplay();
    }
    function updateStreakDisplay() {
        let s=streakData.currentStreak, msg="";
        if(s>=30) msg="🌟 Legendary! Proud of you!";
        else if(s>=14) msg="💪 Two weeks! Becoming the doctor patients need.";
        else if(s>=7) msg="📚 One full week! Consistency is mastery.";
        else if(s>=5) msg="🌱 Small steps, big healing. Keep going!";
        else if(s>=3) msg="👏 Great start! Every day you grow stronger.";
        else if(s>=1) msg="🩺 You're here. One day at a time.";
        else msg="✨ Start your streak today!";
        document.getElementById("rewardDisplay").innerHTML=msg;
        document.getElementById("currentStreakStat").innerText=s;
    }

    function updateCountdown() {
        if(!internshipStartDate) { document.getElementById("countdownDisplay").innerHTML="Set start date"; return; }
        let start=new Date(internshipStartDate);
        let end=new Date(start); end.setFullYear(end.getFullYear()+1);
        let today=new Date();
        let total=(end-start)/(1000*60*60*24);
        let elapsed=(today-start)/(1000*60*60*24);
        let percent=Math.min(100,Math.max(0,(elapsed/total)*100));
        document.getElementById("progressFill").style.width=percent+"%";
        let daysLeft=Math.ceil((end-today)/(1000*60*60*24));
        document.getElementById("countdownDisplay").innerHTML=`📅 Ends on ${end.toLocaleDateString()} (${daysLeft} days left)`;
        document.getElementById("totalInternshipDays").innerText=Math.round(total);
    }

    // Referrals for today
    function getReferralsForToday() {
        let today=getTodayStr();
        let record=allRecords.find(r=>r.date===today && r.name===currentIntern);
        if(record && record.referrals) return record.referrals;
        return [];
    }

    function saveReferralsForToday(refs) {
        let today=getTodayStr();
        let record=allRecords.find(r=>r.date===today && r.name===currentIntern);
        if(!record) {
            record={date:today,name:currentIntern,checkInTime:"",checkOutTime:"",status:"Absent",leavesConsumed:0,remark:"",learning:"",leaveDays:0,leaveReason:"",referrals:refs,rating:0,remarks:""};
            allRecords.push(record);
        } else {
            record.referrals=refs;
        }
        saveRecords();
        renderReferrals();
    }

    function renderReferrals() {
        let refs=getReferralsForToday();
        let container=document.getElementById("referralList");
        container.innerHTML="";
        if(refs.length===0) {
            container.innerHTML="<p style='opacity:0.6;'>No referrals added today.</p>";
            return;
        }
        refs.forEach((ref, idx) => {
            let div=document.createElement("div");
            div.className="referral-entry";
            div.innerHTML=`
                <span><strong>${ref.ipd || ''}</strong> ${ref.patient || ''} (${ref.dept || ''}) ${ref.status || ''} ${ref.done ? '✅' : ''}</span>
                <button class="remove-ref" data-idx="${idx}">✕</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.remove-ref').forEach(btn => {
            btn.onclick = function() {
                let idx=parseInt(this.dataset.idx);
                let refs=getReferralsForToday();
                refs.splice(idx,1);
                saveReferralsForToday(refs);
                renderReferrals();
            };
        });
    }

    function loadReferralsForToday() {
        renderReferrals();
    }

    // Record check-in
    function recordCheckIn(name, photoBase64=null) {
        if(!name) { alert("Enter name"); return false; }
        let today=getTodayStr(), nowTime=getCurrentTimeStr();
        if(allRecords.some(r=>r.date===today && r.name===name && r.checkInTime)) { alert("Already checked in today"); return false; }
        let existing=allRecords.find(r=>r.date===today && r.name===name);
        if(!existing) {
            existing={date:today,name,checkInTime:nowTime,checkOutTime:"",status:"Half Day",leavesConsumed:0,remark:"",learning:"",leaveDays:0,leaveReason:"",referrals:[],rating:0,remarks:"",photo:photoBase64};
            allRecords.push(existing);
        } else {
            existing.checkInTime=nowTime;
            if(photoBase64) existing.photo=photoBase64;
        }
        saveRecords();
        updateUI(name);
        updateStreakAfterCheckIn(today);
        showToast(`Checked IN at ${nowTime}`);
        computeAndUpdateStatus(name, today);
        return true;
    }

    function recordCheckOut(name) {
        if(!name) { alert("Enter name"); return; }
        let today=getTodayStr(), nowTime=getCurrentTimeStr();
        let record=allRecords.find(r=>r.date===today && r.name===name);
        if(!record) { alert("No check-in today"); return; }
        if(record.checkOutTime) { alert("Already checked out"); return; }
        record.checkOutTime=nowTime;
        record.learning=document.getElementById("dailyLearning").value;
        record.rating=parseInt(document.getElementById("ratingValue").value) || 0;
        record.remarks=document.getElementById("dailyRemarks").value.trim();
        saveRecords();
        computeAndUpdateStatus(name, today);
        updateUI(name);
        showToast(`Checked OUT at ${nowTime}`);
    }

    function computeAndUpdateStatus(name, dateStr) {
        let record = allRecords.find(r => r.date === dateStr && r.name === name);
        if(!record) return;
        let status = getStatus(record.checkInTime, record.checkOutTime);
        let oldStatus = record.status;
        record.status = status;
        let leavesConsumed = 0;
        if (status === "Half Day") leavesConsumed = 0.5;
        else if (status === "Absent") leavesConsumed = 1;
        else leavesConsumed = 0;
        if (isHoliday(dateStr)) leavesConsumed = 0;
        if (isSunday(dateStr)) leavesConsumed = 0;
        if (!record.hasOwnProperty('deducted')) record.deducted = false;
        if (!record.deducted && (status === "Half Day" || status === "Absent") && !isHoliday(dateStr) && !isSunday(dateStr)) {
            let amount = status === "Half Day" ? 0.5 : 1;
            let newRem = deductLeave(name, amount);
            record.deducted = true;
            if (newRem < 0) showDangerZone(name);
        }
        record.leavesConsumed = leavesConsumed;
        saveRecords();
        updateUI(name);
    }

    function recordLeave(name, days, reason) {
        if(!name) { alert("Enter name"); return; }
        let remaining=getRemainingLeaves(name);
        if(remaining<days && remaining>=0 && !confirm(`You have only ${remaining} leaves. Continue?`)) return;
        deductLeave(name,days);
        for(let i=0;i<days;i++) {
            let leaveDate=new Date(); leaveDate.setDate(leaveDate.getDate()+i);
            let dateStr=leaveDate.toISOString().slice(0,10);
            if (isSunday(dateStr)) continue;
            let existing=allRecords.find(r=>r.date===dateStr && r.name===name);
            if(!existing || (!existing.checkInTime && !existing.checkOutTime)) {
                allRecords.push({date:dateStr,name,checkInTime:"",checkOutTime:"",status:"Leave",leavesConsumed:1,remark:`Leave: ${reason}`,learning:"",leaveDays:days,leaveReason:reason,referrals:[],rating:0,remarks:"",deducted:true});
            } else {
                existing.remark=(existing.remark?existing.remark+"; ":"")+`Leave (${reason})`;
                existing.leavesConsumed+=1;
                existing.deducted=true;
            }
        }
        saveRecords(); updateUI(name);
        showToast(`${days} day(s) leave recorded. Leaves left: ${getRemainingLeaves(name)}`);
        if(getRemainingLeaves(name)<0) showDangerZone(name);
    }

    function showDangerZone(name) {
        let remaining=getRemainingLeaves(name), overdraft=Math.abs(remaining);
        document.getElementById("dangerZone").style.display="block";
        document.getElementById("dangerZone").innerHTML=`<div class="danger-zone">💀 TU YAHA PE HI REH JAYEGA!! 😈<br>Extension: ${overdraft} day(s) over.</div>`;
    }

    function updateStatsDashboard(name) {
        let records = allRecords.filter(r => r.name === name && !isSunday(r.date));
        let fullDays = records.filter(r => r.status === "Full Day").length;
        let halfDays = records.filter(r => r.status === "Half Day").length;
        let leavesTaken = records.reduce((s,r) => s + (r.leavesConsumed || 0), 0);
        let remainingLeaves = getRemainingLeaves(name);
        let presentDays = records.filter(r => r.status === "Full Day" || r.status === "Half Day").length;
        let totalDays = 0;
        if (internshipStartDate) {
            let start = new Date(internshipStartDate);
            let today = new Date();
            let cur = new Date(start);
            while (cur <= today) {
                let dateStr = cur.toISOString().slice(0,10);
                if (!isSunday(dateStr)) totalDays++;
                cur.setDate(cur.getDate() + 1);
            }
        } else {
            totalDays = Math.max(1, presentDays);
        }
        let percent = Math.round((presentDays / totalDays) * 100);
        document.getElementById("totalFullDays").innerText = fullDays;
        document.getElementById("totalHalfDays").innerText = halfDays;
        document.getElementById("totalLeavesTaken").innerText = leavesTaken.toFixed(1);
        document.getElementById("leavesRemaining").innerText = remainingLeaves;
        document.getElementById("attendancePercent").innerText = percent + "%";
        document.getElementById("currentStreakStat").innerText = streakData.currentStreak;
    }

    function updateUI(name) {
        currentIntern=name;
        let remaining=getRemainingLeaves(name);
        let leaveDiv=document.getElementById("leaveDisplay");
        if(remaining<0) { leaveDiv.innerHTML=`<div class="danger"><strong>⚠️ LEAVES EXHAUSTED!</strong> Remaining: ${remaining} (overdraft) - EXTENSION ZONE ACTIVE.</div>`; showDangerZone(name); }
        else { leaveDiv.innerHTML=`<strong>📆 Leaves left this year:</strong> ${remaining} / 15 (Half day = 0.5 leave)`; document.getElementById("dangerZone").style.display="none"; }
        updateStatsDashboard(name); renderTableAndCharts();
        let today=getTodayStr(), record=allRecords.find(r=>r.date===today && r.name===name);
        if(record) {
            document.getElementById("dailyLearning").value=record.learning||"";
            document.getElementById("ratingValue").value=record.rating||0;
            document.getElementById("dailyRemarks").value=record.remarks||"";
            updateStars(record.rating||0);
            if(record.photo) document.getElementById("photoPreview").innerHTML=`<img src="${record.photo}" class="photo-preview" alt="Check-in photo">`;
            else document.getElementById("photoPreview").innerHTML="";
        } else {
            document.getElementById("dailyLearning").value="";
            document.getElementById("ratingValue").value=0;
            document.getElementById("dailyRemarks").value="";
            updateStars(0);
            document.getElementById("photoPreview").innerHTML="";
        }
        loadReferralsForToday();
        updateCountdown();
    }

    // ==================== STAR RATING ====================
    function updateStars(val) {
        document.querySelectorAll('.star').forEach(el => {
            el.classList.toggle('active', parseInt(el.dataset.value) <= val);
            el.innerText = parseInt(el.dataset.value) <= val ? '★' : '☆';
        });
    }
    document.querySelectorAll('.star').forEach(el => {
        el.addEventListener('click', function() {
            let val = parseInt(this.dataset.value);
            document.getElementById('ratingValue').value = val;
            updateStars(val);
        });
        el.addEventListener('mouseenter', function() {
            let val = parseInt(this.dataset.value);
            document.querySelectorAll('.star').forEach(e => {
                e.innerText = parseInt(e.dataset.value) <= val ? '★' : '☆';
            });
        });
        el.addEventListener('mouseleave', function() {
            let cur = parseInt(document.getElementById('ratingValue').value) || 0;
            updateStars(cur);
        });
    });

    // ==================== IMPROVED CHART FUNCTIONS ====================
    function isDarkMode() {
        return document.body.classList.contains('dark');
    }

    function getChartColors() {
        if (isDarkMode()) {
            return {
                bar: '#3b82f6',
                barBg: 'rgba(59,130,246,0.1)',
                pie1: '#3b82f6',
                pie2: '#f59e0b',
                line: '#10b981',
                text: '#e2e8f0',
                grid: 'rgba(255,255,255,0.1)'
            };
        }
        return {
            bar: '#2c7da0',
            barBg: 'rgba(44,125,160,0.1)',
            pie1: '#2c7da0',
            pie2: '#e67e22',
            line: '#27ae60',
            text: '#2c3e50',
            grid: 'rgba(0,0,0,0.1)'
        };
    }

    function drawBarChart(id, labels, data) {
        const canvas = document.getElementById(id);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const container = canvas.parentElement;
        const w = Math.min(container.clientWidth, 600);
        const h = 300;
        canvas.width = w;
        canvas.height = h;
        ctx.clearRect(0, 0, w, h);
        const colors = getChartColors();

        if (!data.length || data.every(v => v === 0)) {
            ctx.fillStyle = colors.text;
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('No attendance data', w/2, h/2);
            return;
        }

        const padding = { top: 20, bottom: 30, left: 10, right: 10 };
        const chartW = w - padding.left - padding.right;
        const chartH = h - padding.top - padding.bottom;
        const maxVal = Math.max(...data, 1);
        const barWidth = Math.min(chartW / data.length * 0.7, 30);
        const gap = (chartW - barWidth * data.length) / (data.length + 1);

        // Draw grid lines
        ctx.strokeStyle = colors.grid;
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 5; i++) {
            const y = padding.top + chartH - (i / 5) * chartH;
            ctx.beginPath();
            ctx.moveTo(padding.left, y);
            ctx.lineTo(w - padding.right, y);
            ctx.stroke();
            ctx.fillStyle = colors.text;
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(Math.round((i / 5) * maxVal), padding.left - 2, y + 3);
        }

        // Draw bars
        for (let i = 0; i < data.length; i++) {
            const x = padding.left + gap + i * (barWidth + gap);
            const barHeight = (data[i] / maxVal) * chartH;
            ctx.fillStyle = colors.bar;
            ctx.fillRect(x, padding.top + chartH - barHeight, barWidth, barHeight);
            // Label
            ctx.fillStyle = colors.text;
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'center';
            const label = labels[i] ? labels[i].slice(5) : '';
            ctx.fillText(label, x + barWidth/2, padding.top + chartH + 14);
        }
    }

    function drawPieChart(id, data, labels) {
        const canvas = document.getElementById(id);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const container = canvas.parentElement;
        const size = Math.min(container.clientWidth, 300);
        canvas.width = size;
        canvas.height = size;
        ctx.clearRect(0, 0, size, size);
        const colors = getChartColors();

        const total = data.reduce((a,b) => a+b, 0);
        if (total === 0) {
            ctx.fillStyle = colors.text;
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('No data', size/2, size/2);
            return;
        }

        const center = size / 2;
        const radius = size / 2 - 20;
        let startAngle = -Math.PI / 2;
        const colorList = [colors.pie1, colors.pie2];

        for (let i = 0; i < data.length; i++) {
            const sliceAngle = (data[i] / total) * 2 * Math.PI;
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, startAngle, startAngle + sliceAngle);
            ctx.closePath();
            ctx.fillStyle = colorList[i % colorList.length];
            ctx.fill();
            // Draw percentage text
            const midAngle = startAngle + sliceAngle / 2;
            const textRadius = radius * 0.65;
            const x = center + Math.cos(midAngle) * textRadius;
            const y = center + Math.sin(midAngle) * textRadius;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const pct = Math.round((data[i] / total) * 100);
            if (pct > 5) ctx.fillText(pct + '%', x, y);
            startAngle += sliceAngle;
        }

        // Legend
        const legendY = size + 10;
        let xPos = 10;
        ctx.font = '12px sans-serif';
        for (let i = 0; i < labels.length; i++) {
            ctx.fillStyle = colorList[i % colorList.length];
            ctx.fillRect(xPos, legendY, 12, 12);
            ctx.fillStyle = colors.text;
            ctx.textBaseline = 'middle';
            ctx.fillText(labels[i] + ' (' + data[i] + ')', xPos + 16, legendY + 6);
            xPos += ctx.measureText(labels[i] + ' (' + data[i] + ')').width + 30;
        }
    }

    function drawLineChart(id, labels, data) {
        const canvas = document.getElementById(id);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const container = canvas.parentElement;
        const w = Math.min(container.clientWidth, 600);
        const h = 300;
        canvas.width = w;
        canvas.height = h;
        ctx.clearRect(0, 0, w, h);
        const colors = getChartColors();

        if (data.length < 2) {
            ctx.fillStyle = colors.text;
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Need at least 2 days for trend', w/2, h/2);
            return;
        }

        const padding = { top: 20, bottom: 30, left: 20, right: 20 };
        const chartW = w - padding.left - padding.right;
        const chartH = h - padding.top - padding.bottom;
        const maxVal = Math.max(...data, 1);
        const minVal = Math.min(...data, 0);
        const range = maxVal - minVal || 1;

        // Grid
        ctx.strokeStyle = colors.grid;
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 5; i++) {
            const y = padding.top + chartH - (i / 5) * chartH;
            ctx.beginPath();
            ctx.moveTo(padding.left, y);
            ctx.lineTo(w - padding.right, y);
            ctx.stroke();
            ctx.fillStyle = colors.text;
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(Math.round(minVal + (i / 5) * range), padding.left - 2, y + 3);
        }

        // Draw line
        ctx.beginPath();
        ctx.strokeStyle = colors.line;
        ctx.lineWidth = 2;
        for (let i = 0; i < data.length; i++) {
            const x = padding.left + (i / (data.length - 1)) * chartW;
            const y = padding.top + chartH - ((data[i] - minVal) / range) * chartH;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Draw points and labels
        for (let i = 0; i < data.length; i++) {
            const x = padding.left + (i / (data.length - 1)) * chartW;
            const y = padding.top + chartH - ((data[i] - minVal) / range) * chartH;
            ctx.fillStyle = colors.line;
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = colors.text;
            ctx.font = '8px sans-serif';
            ctx.textAlign = 'center';
            const label = labels[i] ? labels[i].slice(5) : '';
            ctx.fillText(label, x, padding.top + chartH + 12);
        }
    }

    // ==================== FILTERING AND RENDERING ====================
    function getDateRange() {
        let end = new Date();
        let start;
        if (currentRange && !customStartDate) {
            start = new Date();
            start.setDate(start.getDate() - currentRange);
        } else if (customStartDate && customEndDate) {
            start = new Date(customStartDate);
            end = new Date(customEndDate);
        } else {
            start = new Date();
            start.setDate(start.getDate() - 30);
        }
        return { start, end };
    }

    function getFilteredDataForCharts() {
        if (!currentIntern) return { barDates: [], barData: [], fullDays: 0, halfDays: 0, trendLabels: [], trendData: [] };
        const { start, end } = getDateRange();
        const records = allRecords.filter(r => r.name === currentIntern && !isSunday(r.date));
        const dates = [];
        let cur = new Date(start);
        while (cur <= end) {
            dates.push(cur.toISOString().slice(0, 10));
            cur.setDate(cur.getDate() + 1);
        }
        const attMap = new Map();
        records.forEach(r => { if (r.status === "Full Day" || r.status === "Half Day") attMap.set(r.date, 1); });
        const barData = dates.map(d => attMap.has(d) ? 1 : 0);
        const recRange = records.filter(r => r.date >= start.toISOString().slice(0,10) && r.date <= end.toISOString().slice(0,10));
        const fullDays = recRange.filter(r => r.status === "Full Day").length;
        const halfDays = recRange.filter(r => r.status === "Half Day").length;
        const sorted = recRange.filter(r => r.status !== "Leave" && r.status !== "Absent").sort((a,b) => a.date.localeCompare(b.date));
        const cum = [], cumLabels = [];
        let cnt = 0;
        for (let rec of sorted) {
            cnt++;
            cum.push(cnt);
            cumLabels.push(rec.date);
        }
        return { barDates: dates, barData, fullDays, halfDays, trendLabels: cumLabels, trendData: cum };
    }

    let chartResizeObserver = null;
    function renderTableAndCharts() {
        let search = document.getElementById("searchLearning").value.toLowerCase();
        let data = currentIntern ? allRecords.filter(r => r.name === currentIntern) : allRecords;
        if (search) data = data.filter(r => (r.learning || "").toLowerCase().includes(search) || (r.remark || "").toLowerCase().includes(search) || (r.patient || "").toLowerCase().includes(search));
        let tbody = document.querySelector("#recordsTable tbody");
        tbody.innerHTML = "";
        for (let rec of data) {
            let row = tbody.insertRow();
            row.insertCell(0).innerText = rec.date;
            row.insertCell(1).innerText = rec.name;
            row.insertCell(2).innerText = rec.checkInTime || "--";
            row.insertCell(3).innerText = rec.checkOutTime || "--";
            let sc = rec.status === "Full Day" ? "green" : (rec.status === "Half Day" ? "orange" : "red");
            row.insertCell(4).innerHTML = `<span style="color:${sc};font-weight:bold;">${rec.status}${isHoliday(rec.date)?' 🎉':''}${isSunday(rec.date)?' (Sun)':''}</span>`;
            row.insertCell(5).innerText = rec.leavesConsumed;
            row.insertCell(6).innerText = rec.learning || "";
            let refs = rec.referrals || [];
            let refSummary = refs.map(r => `${r.patient||''}(${r.dept||''})`).join(', ');
            row.insertCell(7).innerText = refSummary || '—';
            row.insertCell(8).innerText = rec.rating ? "★".repeat(rec.rating) : "";
            row.insertCell(9).innerText = rec.remarks || "";
        }
        const { barDates, barData, fullDays, halfDays, trendLabels, trendData } = getFilteredDataForCharts();
        drawBarChart('weeklyCanvas', barDates, barData);
        drawPieChart('pieCanvas', [fullDays, halfDays], ['Full Day', 'Half Day']);
        drawLineChart('trendCanvas', trendLabels, trendData);
        if (currentIntern) updateStatsDashboard(currentIntern);
    }

    // Set up resize observer for charts
    function setupChartResize() {
        if (chartResizeObserver) chartResizeObserver.disconnect();
        const containers = document.querySelectorAll('.chart-container');
        chartResizeObserver = new ResizeObserver(() => {
            renderTableAndCharts();
        });
        containers.forEach(container => chartResizeObserver.observe(container));
    }

    // ==================== CSV EXPORT/IMPORT ====================
    function exportCSV(){
        let data=currentIntern?allRecords.filter(r=>r.name===currentIntern):allRecords;
        let headers=["Date","Name","CheckIn","CheckOut","Status","LeavesUsed","Learning","Referrals","Rating","Remarks"];
        let rows=[headers.join(",")];
        for(let r of data){
            let refs = (r.referrals||[]).map(ref => `${ref.ipd||''}|${ref.patient||''}|${ref.dept||''}|${ref.status||''}|${ref.done?'Done':'Pending'}`).join('; ');
            rows.push([
                r.date, r.name, r.checkInTime||"", r.checkOutTime||"", r.status, r.leavesConsumed,
                r.learning||"", refs, r.rating||0, r.remarks||""
            ].join(","));
        }
        let blob=new Blob([rows.join("\n")],{type:"text/csv"}), a=document.createElement("a");
        a.href=URL.createObjectURL(blob); a.download=`attendance_${currentIntern||"all"}.csv`; a.click(); URL.revokeObjectURL(a.href);
    }

    function importCSV(file){
        let reader=new FileReader();
        reader.onload=function(e){
            let text=e.target.result.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
            let lines=text.split("\n");
            let newRec=[];
            for(let i=1;i<lines.length;i++){
                if(!lines[i].trim()) continue;
                let parts=lines[i].split(",").map(p=>p.trim().replace(/^"|"$/g,''));
                if(parts.length>=7){
                    let rec={
                        date: parts[0]||"",
                        name: parts[1]||"",
                        checkInTime: parts[2]||"",
                        checkOutTime: parts[3]||"",
                        status: parts[4]||"",
                        leavesConsumed: parseFloat(parts[5])||0,
                        learning: parts[6]||"",
                        referrals: parts[7] ? parts[7].split(';').map(refStr => {
                            let refParts = refStr.split('|');
                            return { ipd: refParts[0]||'', patient: refParts[1]||'', dept: refParts[2]||'', status: refParts[3]||'Pending', done: refParts[4]==='Done' };
                        }) : [],
                        rating: parseInt(parts[8])||0,
                        remarks: parts[9]||"",
                        leaveDays:0, leaveReason:"", remark:"", photo:null, deducted:true
                    };
                    newRec.push(rec);
                }
            }
            allRecords.push(...newRec);
            saveRecords(); updateUI(currentIntern);
            showToast(`Imported ${newRec.length} records`);
        };
        reader.readAsText(file);
    }

    // ==================== CERTIFICATE ====================
    function generatePDFCertificate(){
        if(!currentIntern){ alert("Enter your name first"); return; }
        const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
        doc.setFillColor(44,125,160); doc.rect(0,0,297,210,'F');
        doc.setTextColor(255,255,255); doc.setFontSize(28); doc.text("Certificate of Attendance",297/2,40,{align:'center'});
        doc.setTextColor(255,255,255); doc.setFontSize(16); doc.text("This certificate is proudly presented to",297/2,70,{align:'center'});
        doc.setTextColor(255,215,0); doc.setFontSize(32); doc.text(currentIntern,297/2,95,{align:'center'});
        doc.setTextColor(255,255,255); doc.setFontSize(14); let stats=document.getElementById("attendancePercent").innerText;
        doc.text(`With ${stats} attendance rate`,297/2,125,{align:'center'});
        doc.setFontSize(12); doc.text(`Generated on ${new Date().toLocaleDateString()}`,297/2,180,{align:'center'});
        doc.save(`Attendance_Certificate_${currentIntern}.pdf`);
        showToast("Certificate generated!");
    }

    // ==================== PHOTO ====================
    function capturePhoto(){
        if(!currentIntern){ alert("Enter name first"); return; }
        let input=document.createElement('input'); input.type='file'; input.accept='image/*'; input.capture='environment';
        input.onchange=(e)=>{
            let file=e.target.files[0]; if(!file)return;
            let reader=new FileReader(); reader.onload=(ev)=>{ photoData=ev.target.result; recordCheckIn(currentIntern,photoData); }; reader.readAsDataURL(file);
        }; input.click();
    }

    // ==================== ADMIN TEST MODE ====================
    function enableTestMode(){ testModeEnabled=true; document.getElementById("testPanel").classList.remove("hidden"); updateTestStatus(); showToast("Test Mode Enabled"); updateButtonState(); }
    function disableTestMode(){ testModeEnabled=false; simulatedDateOffset=0; simulatedTime=new Date().toTimeString().slice(0,8); document.getElementById("testPanel").classList.add("hidden"); updateTestStatus(); if(currentIntern) updateUI(currentIntern); else renderTableAndCharts(); updateButtonState(); }
    function updateTestStatus(){ let msgSpan=document.getElementById("testStatusMsg"); if(testModeEnabled){ let offset=simulatedDateOffset===0?" (real date)":` +${simulatedDateOffset} day(s)`; msgSpan.innerHTML=`⚙️ Test Active | Time: ${simulatedTime.slice(0,5)} | Date offset:${offset}`; } else { msgSpan.innerHTML="Test Mode Disabled"; } updateButtonState(); }
    function populateTimeSelect(){ let select=document.getElementById("testTimeSelect"); select.innerHTML=""; for(let h=0;h<=23;h++){ for(let m=0;m<60;m+=5){ let time=`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:00`; let opt=document.createElement("option"); opt.value=time; opt.textContent=time.slice(0,5); select.appendChild(opt); } } select.value="09:00:00"; simulatedTime="09:00:00"; }

    // ==================== MISC ====================
    function showToast(msg){ let t=document.createElement("div"); t.className="toast"; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
    function setRange(days,btn){ currentRange=days; customStartDate=""; customEndDate=""; document.getElementById("filterStartDate").value=""; document.getElementById("filterEndDate").value=""; document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active'); renderTableAndCharts(); showToast(`Last ${days} days`); }
    function resetFilters(){ currentRange=30; customStartDate=""; customEndDate=""; document.getElementById("filterStartDate").value=""; document.getElementById("filterEndDate").value=""; document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active')); let def=document.querySelector('.range-btn[data-range="30"]'); if(def)def.classList.add('active'); renderTableAndCharts(); showToast("Reset to 30 days"); }
    function applyCustomFilter(){ let s=document.getElementById("filterStartDate").value, e=document.getElementById("filterEndDate").value; if(s&&e){ customStartDate=s; customEndDate=e; currentRange=null; document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active')); renderTableAndCharts(); showToast(`Custom: ${s} to ${e}`); } else showToast("Select both dates"); }

    // Live clock
    function updateLiveClock(){ let n=new Date(); document.getElementById("liveClock").innerText=n.toLocaleTimeString(); document.getElementById("liveDate").innerText=n.toLocaleDateString(); updateButtonState(); }
    setInterval(updateLiveClock,1000);

    // ==================== EVENT LISTENERS ====================
    document.getElementById("internName").addEventListener("input",(e)=>{ let n=e.target.value.trim(); if(n){ currentIntern=n; localStorage.setItem("saved_intern_name",n); updateUI(n); } });
    document.getElementById("checkInBtn").onclick=()=>{ let n=document.getElementById("internName").value.trim(); if(n) recordCheckIn(n); else alert("Enter name"); };
    document.getElementById("checkOutBtn").onclick=()=>{ let n=document.getElementById("internName").value.trim(); if(n) recordCheckOut(n); else alert("Enter name"); };
    document.getElementById("takeLeaveBtn").onclick=()=>{ document.getElementById("leaveModal").style.display="block"; };
    document.getElementById("confirmLeaveBtn").onclick=()=>{ let n=document.getElementById("internName").value.trim(), d=parseInt(document.getElementById("leaveDays").value), r=document.getElementById("leaveReason").value.trim()||"Not specified"; if(n&&d>0) recordLeave(n,d,r); document.getElementById("leaveModal").style.display="none"; };
    document.getElementById("cancelLeaveBtn").onclick=()=>{ document.getElementById("leaveModal").style.display="none"; };
    document.getElementById("photoCheckInBtn").onclick=()=>{ let n=document.getElementById("internName").value.trim(); if(n) capturePhoto(); else alert("Enter name first"); };
    document.getElementById("getCertificateBtn").onclick=generatePDFCertificate;
    document.getElementById("switchUserBtn").onclick=()=>{ localStorage.removeItem("saved_intern_name"); document.getElementById("internName").value=""; currentIntern=""; renderTableAndCharts(); showToast("Switched user"); };
    document.getElementById("clearDataBtn").onclick=()=>{ if(confirm("Delete ALL data?")){ localStorage.clear(); location.reload(); } };
    document.getElementById("exportCsvBtn").onclick=exportCSV;
    document.getElementById("importCsvBtn").onclick=()=>{ document.getElementById("importFile").click(); };
    document.getElementById("importFile").onchange=(e)=>{ if(e.target.files.length) importCSV(e.target.files[0]); };
    document.getElementById("filterBtn").onclick=applyCustomFilter;
    document.getElementById("resetFilterBtn").onclick=resetFilters;
    document.getElementById("searchLearning").addEventListener("input",()=>renderTableAndCharts());
    document.getElementById("setStartDateBtn").onclick=()=>{ let d=document.getElementById("startDateInput").value; if(d){ internshipStartDate=d; localStorage.setItem("internship_start_date",d); updateCountdown(); updateStatsDashboard(currentIntern); showToast("Start date set"); } };
    document.getElementById("darkModeToggle").onclick=()=>{ document.body.classList.toggle("dark"); localStorage.setItem("dark_mode",document.body.classList.contains("dark")); renderTableAndCharts(); };
    document.querySelectorAll('.range-btn').forEach(btn=>{ btn.addEventListener('click',(e)=>{ let days=parseInt(btn.getAttribute('data-range')); setRange(days,btn); }); });

    // Referrals
    document.getElementById("addRefBtn").onclick=function(){
        let ipd=document.getElementById("newRefIpd").value.trim();
        let patient=document.getElementById("newRefPatient").value.trim();
        let dept=document.getElementById("newRefDept").value;
        let status=document.getElementById("newRefStatus").value;
        let done=document.getElementById("newRefDone").checked;
        if(!ipd && !patient && !dept) { showToast("Please fill at least IPD or Patient name"); return; }
        let refs=getReferralsForToday();
        refs.push({ipd, patient, dept, status, done});
        saveReferralsForToday(refs);
        renderReferrals();
        document.getElementById("newRefIpd").value="";
        document.getElementById("newRefPatient").value="";
        document.getElementById("newRefDept").value="";
        document.getElementById("newRefStatus").value="Pending";
        document.getElementById("newRefDone").checked=false;
        showToast("Referral added!");
    };

    // Admin Test Mode
    let adminTestBtn=document.getElementById("adminTestBtn"), passwordModal=document.getElementById("passwordModal"), closePasswordModal=document.getElementById("closePasswordModal"), submitPasswordBtn=document.getElementById("submitPasswordBtn"), adminPasswordInput=document.getElementById("adminPassword"), disableTestBtn=document.getElementById("disableTestBtn"), testTimeSelect=document.getElementById("testTimeSelect"), nextDayBtn=document.getElementById("nextDayBtn");
    adminTestBtn.onclick=()=>{ passwordModal.style.display="flex"; };
    closePasswordModal.onclick=()=>{ passwordModal.style.display="none"; adminPasswordInput.value=""; };
    submitPasswordBtn.onclick=()=>{
        if(adminPasswordInput.value===ADMIN_PASSWORD){ passwordModal.style.display="none"; enableTestMode(); adminPasswordInput.value=""; }
        else { alert("Incorrect password."); adminPasswordInput.value=""; }
    };
    disableTestBtn.onclick=()=>{ disableTestMode(); };
    testTimeSelect.onchange=(e)=>{ if(testModeEnabled){ simulatedTime=e.target.value; updateTestStatus(); } };
    nextDayBtn.onclick=()=>{ if(testModeEnabled){ simulatedDateOffset++; updateTestStatus(); showToast(`Test date +${simulatedDateOffset} day(s)`); if(currentIntern) updateUI(currentIntern); else renderTableAndCharts(); } };

    // Modals
    let aboutModal=document.getElementById("aboutModal"), aboutBtn=document.getElementById("aboutBtn"), closeAboutBtn=document.getElementById("closeAboutBtn");
    let helpModal=document.getElementById("helpModal"), helpBtn=document.getElementById("helpBtn"), closeHelpBtn=document.getElementById("closeHelpBtn");
    aboutBtn.onclick=()=>aboutModal.style.display="flex"; closeAboutBtn.onclick=()=>aboutModal.style.display="none";
    helpBtn.onclick=()=>helpModal.style.display="flex"; closeHelpBtn.onclick=()=>helpModal.style.display="none";
    window.onclick=(e)=>{ if(e.target===aboutModal) aboutModal.style.display="none"; if(e.target===helpModal) helpModal.style.display="none"; if(e.target===passwordModal) passwordModal.style.display="none"; };

    // Init
    populateTimeSelect();
    loadData();
    updateLiveClock();
    if(currentIntern) updateUI(currentIntern);
    else renderTableAndCharts();
    document.querySelector('.range-btn[data-range="30"]')?.classList.add('active');
    currentRange=30; renderTableAndCharts();
    setTimeout(()=>{ requestNotificationPermission(); scheduleReminders(); }, 2000);
    // Setup resize observer after DOM is ready
    setTimeout(setupChartResize, 500);
</script>
